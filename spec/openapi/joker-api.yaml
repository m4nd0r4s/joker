    post:
      tags: [outputs]
      operationId: previewManualWrite
      summary: Preview of a manual write - envelope, active level and predicted result; does not write
      x-joker-role: viewer
      x-joker-cli: [jk write]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SignalPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualWriteRequest'}
      responses:
        '200':
          description: OK
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WritePreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/outputs/{path}/manual:
    post:
      tags: [outputs]
      operationId: manualWrite
      summary: Manual write with mandatory TTL (A10); renews if the same principal already holds the level
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk write]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SignalPath'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualWriteRequest'}
      responses:
        '200':
          description: Applied on the owning group tick; the envelope result comes in the body (a rejected write is a 200 response)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteTicket'}
        '202':
          description: In the owning group inbox; result in Location (wait=false or timeout)
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WriteTicket'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Problem'}
