      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequired'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
