      x-joker-cli: [jk action]
      x-joker-since: '1.0'
      parameters:
        - name: target
          in: query
          schema: {$ref: '#/components/schemas/Name'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
