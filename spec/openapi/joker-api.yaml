openapi: 3.1.0
info:
  title: Joker local API (jokerd)
  version: 1.0.0
  summary: Local HTTP and WebSocket API of jokerd. The jk CLI is only a client of this API.
  description: >-
    Normative reference: docs/ref/09-http-api.md. Cross-cutting conventions: docs/ref/00-conventions.md.
    Transports: Unix socket /run/joker/api.sock (default; authentication by the file permissions
    and by the peer credentials, SO_PEERCRED) and TCP with TLS 1.3 and mandatory mTLS (default port 7443).
    HTTP/1.1 and HTTP/2. All paths start with /v1 (ADR 0022). Errors in application/problem+json
    (RFC 9457) with the code member (J-code). Extensions used in this document -
    x-joker-role (minimum role), x-joker-mutating (requires Joker-Nonce and Joker-Timestamp over TCP and over a tunnel),
    x-joker-cli (jk commands that use the operation), x-joker-since (API version in which the operation exists).
  license:
    name: to be defined (document 18, §5)
servers:
  - url: http://joker
    description: Unix socket /run/joker/api.sock (the Host is ignored). curl --unix-socket /run/joker/api.sock http://joker/v1/info
  - url: https://{node}:{port}
    description: TCP with TLS 1.3 and mandatory mTLS
    variables:
      node:
        default: node.example.com
      port:
        default: '7443'
security:
  - mtls: []
  - {}
tags:
  - name: meta
  - name: node
  - name: signals
  - name: history
  - name: outputs
  - name: alarms
  - name: intents
  - name: actions
  - name: instances
  - name: devices
  - name: apps
  - name: shadows
  - name: generations
  - name: blobs
  - name: runtime
  - name: traces
  - name: jobs
  - name: diagnostics
  - name: uplinks
  - name: micros
  - name: sim
  - name: audit
  - name: streaming
  - name: agent
    description: node agent (ref/10) and node trust (ref/09 §5.21)
  - name: reserved
paths:
  # ------------------------------------------------------------------ meta
  /v1/info:
    get:
      tags: [meta]
      operationId: getInfo
      summary: Node identity, versions, generation, clock, limits and capabilities
      x-joker-role: viewer
      x-joker-cli: [jk status, jk top, all (session startup)]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          headers:
            Joker-Generation: {$ref: '#/components/headers/JokerGeneration'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Info'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: Versions of all supported surfaces (compatibility negotiation)
      x-joker-role: viewer
      x-joker-cli: [jk (compatibility check)]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Aggregate health (200 for ok and degraded, 503 for failed)
      x-joker-role: viewer
      x-joker-since: '1.0'
      parameters:
        - name: probe
          in: query
          schema: {type: string, enum: [live, ready, full], default: full}
      responses:
        '200':
          description: ok or degraded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: failed, or not ready yet (probe=ready)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/whoami:
    get:
      tags: [meta]
      operationId: whoAmI
      summary: Identity and role of the caller
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhoAmI'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/status:
    get:
      tags: [meta]
      operationId: getStatus
      summary: Operational summary (jk status)
      x-joker-role: viewer
      x-joker-cli: [jk status]
      x-joker-since: '1.0'
      parameters:
        - name: instances
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: OK
          headers:
            Joker-Generation: {$ref: '#/components/headers/JokerGeneration'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/openapi.json:
    get:
      tags: [meta]
      operationId: getOpenApiJson
      summary: This document in JSON
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object}
  /v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenApiYaml
      summary: This document in YAML
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/yaml:
              schema: {type: string}
  # ------------------------------------------------------------------ node
  /v1/node:
    get:
      tags: [node]
      operationId: getNode
      summary: Node identity and enrollment state
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/enrollment/csr:
    post:
      tags: [node]
      operationId: createEnrollmentCsr
      summary: Generates (or rotates) the node key and, on the first enrollment, the X25519 KEM key; returns a PKCS#10 CSR (only over the bootstrap channel)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-transports: [unix]
      x-joker-cli: [jk node enroll]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
        - $ref: '#/components/parameters/JokerEnrollCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentCsrRequest'}
      responses:
        '200':
          description: CSR generated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentCsr'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/enrollment/certificate:
    put:
      tags: [node]
      operationId: installEnrollmentCertificate
      summary: Installs the chain issued by the organization CA, the anchors and the first bundle (only over the bootstrap channel)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-transports: [unix]
      x-joker-cli: [jk node enroll]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
        - $ref: '#/components/parameters/JokerEnrollCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentCertificate'}
      responses:
        '200':
          description: Installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/enrollment/deck:
    post:
      tags: [node]
      operationId: enrollWithDeck
      summary: Enrolls the node in a Deck with a token (ref/10 §3.1.2); the node makes the POST /enroll
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-transports: [unix]
      x-joker-cli: [jk node enroll --deck]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
        - $ref: '#/components/parameters/JokerEnrollCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeckEnrollRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/renew:
    post:
      tags: [node]
      operationId: renewNode
      summary: Renews the node certificate now (the KEM key is kept)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk node renew]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenewRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/hardware:
    get:
      tags: [node]
      operationId: getNodeHardware
      summary: Inventory of the node hardware, using only reads from /proc, /sys and /dev
      description: >-
        Architecture, model, CPUs, memory, kernel, boot command line, GPIO chips (with the lines already
        in use), LEDs, thermal zones, watchdogs, serial ports (with the by-id paths), I2C, SPI,
        network interfaces, USB devices and TPM. Read on every request; nothing is opened for writing and
        no GPIO line is reserved. An unreadable field comes as null and appears in unreadable.
        Reference - docs/ref/09-http-api.md §5.2; usage - jk board probe and jk board check --node (ref/03 §2.3.7).
      x-joker-role: viewer
      x-joker-cli: [jk board probe, jk board check --node]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeHardware'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/trust:
    get:
      tags: [agent]
      operationId: getNodeTrust
      summary: Anchors, active trust bundle, floors and revoked keys
      x-joker-role: viewer
      x-joker-cli: [jk node trust show]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustState'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/trust/bundle:
    put:
      tags: [agent]
      operationId: pushTrustBundle
      summary: Installs a trust bundle (COSE_Sign1 signed by an anchor, higher version)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk node trust push]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/cose:
            schema: {type: string, contentMediaType: application/cose}
      responses:
        '200':
          description: Installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustState'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/trust/anchors:
    put:
      tags: [agent]
      operationId: setTrustAnchors
      summary: Replaces the trust anchors (document signed by a current anchor; ref/02 §3.2.3)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk node trust set]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/cose:
            schema: {type: string, contentMediaType: application/cose}
      responses:
        '200':
          description: Anchors replaced; node.toml rewritten
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustState'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/groups:
    get:
      tags: [node]
      operationId: listGroups
      summary: Cycle groups with statistics
      x-joker-role: viewer
      x-joker-cli: [jk status, jk top]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/groups/{group}:
    get:
      tags: [node]
      operationId: getGroup
      x-joker-role: viewer
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GroupName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/metrics:
    get:
      tags: [node]
      operationId: getMetrics
      summary: Snapshot of the runtime metrics, including histograms (jk top)
      x-joker-role: viewer
      x-joker-cli: [jk top]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metrics'}
        default: {$ref: '#/components/responses/Problem'}
  /metrics:
    get:
      tags: [node]
      operationId: getPrometheusMetrics
      summary: The /v1/metrics snapshot in the Prometheus text exposition format 0.0.4 (ADR 0071)
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: Prometheus text exposition; names, labels and types in ADR 0071
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /v1/logs:
    get:
      tags: [node]
      operationId: listLogs
      summary: Structured logs from the API ring (jk logs); to follow, logs topic on /v1/ws or /v1/stream
      x-joker-role: viewer
      x-joker-cli: [jk logs, jk app logs, jk dev]
      x-joker-since: '1.0'
      parameters:
        - name: source
          in: query
          description: jokerd, app:<a>, driver:<d>, micro:<d>, api
          schema: {type: string}
        - name: app
          in: query
          schema: {$ref: '#/components/schemas/Name'}
        - name: level
          in: query
          schema: {$ref: '#/components/schemas/LogLevel'}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LogEntry'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/LogEntry'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: API audit log (requests that change state, sessions, refusals)
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - name: principal
          in: query
          schema: {type: string}
        - name: operation
          in: query
          description: operationId
          schema: {type: string}
        - name: outcome
          in: query
          schema: {type: string, enum: [ok, refused, error]}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/AuditEntry'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sessions:
    get:
      tags: [audit]
      operationId: listSessions
      summary: Active sessions (persistent HTTP connections, WebSocket, SSE, tunnel)
      x-joker-role: admin
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sessions/{session}:
    delete:
      tags: [audit]
      operationId: closeSession
      summary: Closes a session (WebSocket closed with 4009)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      responses:
        '204': {description: Closed}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/secrets:
    get:
      tags: [node]
      operationId: listSecrets
      summary: Secret names and metadata; never the values
      x-joker-role: admin
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SecretEntry'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [node]
      operationId: pushSecrets
      summary: Receives a secret-bundle (joker.secrets.v1) with the encrypted entries for this node
      description: >-
        Each entry is verified on its own (ref/02 §3.4.3): signature of the secrets role, wrap for this node,
        test decryption and rev. The plaintext value never crosses the API (ref/00 §9).
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk secret push, jk apply]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/vnd.joker.secrets.v1+cbor:
            schema: {type: string, contentMediaType: application/vnd.joker.secrets.v1+cbor}
      responses:
        '200':
          description: Result per entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretPushResult'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/secrets/{secret}:
    put:
      tags: [node]
      operationId: putSecret
      summary: Sets a secret from an entry encrypted with HPKE for the node KEM key (never in plaintext)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SecretName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SealedSecret'}
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretEntry'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [node]
      operationId: deleteSecret
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SecretName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ signals
  /v1/signals:
    get:
      tags: [signals]
      operationId: listSignals
      summary: Signal registry of the running generation (metadata; values with values=true)
      x-joker-role: viewer
      x-joker-cli: [jk read, jk explain, jk dev]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/Sel'
        - name: direction
          in: query
          schema: {$ref: '#/components/schemas/Direction'}
        - name: origin
          in: query
          schema: {$ref: '#/components/schemas/OriginKind'}
        - name: device
          in: query
          schema: {$ref: '#/components/schemas/Name'}
        - name: instance
          in: query
          schema: {$ref: '#/components/schemas/Name'}
        - name: shape
          in: query
          schema: {$ref: '#/components/schemas/Shape'}
        - name: values
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Mono'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Joker-Generation: {$ref: '#/components/headers/JokerGeneration'}
          content:
            application/json:
              schema:
                type: object
                required: [generation, registry, items, next_cursor]
                properties:
                  generation: {$ref: '#/components/schemas/GenerationRef'}
                  registry: {$ref: '#/components/schemas/Digest'}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SignalMeta'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/signals/{path}:
    get:
      tags: [signals]
      operationId: getSignal
      summary: Metadata and current sample of a signal (canonical path or alias)
      x-joker-role: viewer
      x-joker-cli: [jk read, jk explain]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SignalPath'
        - $ref: '#/components/parameters/Mono'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalMeta'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/signals/{path}/lineage:
    get:
      tags: [signals]
      operationId: getSignalLineage
      summary: Static graph of a signal - driver, acquisition, readers, writers, envelope, readback (jk trace)
      x-joker-role: viewer
      x-joker-cli: [jk trace]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SignalPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Lineage'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
