      tags: [streaming]
      operationId: websocket
      summary: Subscription WebSocket (subprotocol joker.v1); messages in WsClientMessage and WsServerMessage
      x-joker-role: viewer
      x-joker-cli: [jk read --watch, jk top, jk trace, jk logs --follow, jk dev]
      x-joker-since: '1.0'
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema: {type: string, const: joker.v1}
      responses:
        '101': {description: Switching Protocols}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/stream:
    get:
      tags: [streaming]
      operationId: sse
      summary: Server-Sent Events - one subscription per request, with the same JSON messages as the WebSocket
      x-joker-role: viewer
      x-joker-cli: [curl, scripts]
      x-joker-since: '1.0'
      parameters:
        - name: topic
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Topic'}
        - name: sel
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 64
            items: {$ref: '#/components/schemas/Selector'}
        - name: min_interval
          in: query
          schema: {$ref: '#/components/schemas/Duration'}
        - name: initial
          in: query
          schema: {type: boolean, default: true}
        - $ref: '#/components/parameters/Mono'
        - name: filter
          in: query
          description: topic filters in JSON (the same fields as subscribe)
          schema: {type: string, maxLength: 4096}
        - name: Last-Event-ID
          in: header
          schema: {type: string}
      responses:
        '200':
          description: text/event-stream stream
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Problem'}
