openapi: 3.1.0
info:
  title: Joker local API (jokerd)
  version: 1.0.0
  summary: API HTTP local e WebSocket do jokerd. A CLI jk é apenas um cliente desta API.
  description: >-
    Referência normativa: docs/ref/09-api-http.md. Convenções transversais: docs/ref/00-convencoes.md.
    Transportes: socket Unix /run/joker/api.sock (omissão; autenticação pelas permissões do ficheiro
    e pelas credenciais do par, SO_PEERCRED) e TCP com TLS 1.3 e mTLS obrigatório (porta de omissão 7443).
    HTTP/1.1 e HTTP/2. Todos os caminhos começam por /v1 (ADR 0022). Erros em application/problem+json
    (RFC 9457) com o membro code (J-code). Extensões usadas neste documento -
    x-joker-role (papel mínimo), x-joker-mutating (exige Joker-Nonce e Joker-Timestamp em TCP e em túnel),
    x-joker-cli (comandos jk que usam a operação), x-joker-since (versão da API em que a operação existe).
  license:
    name: a definir (documento 18, §5)
servers:
  - url: http://joker
    description: Socket Unix /run/joker/api.sock (o Host é ignorado). curl --unix-socket /run/joker/api.sock http://joker/v1/info
  - url: https://{node}:{port}
    description: TCP com TLS 1.3 e mTLS obrigatório
    variables:
      node:
        default: node.example.com
      port:
        default: '7443'
security:
  - mtls: []
  - {}
tags:
  - name: meta
  - name: node
  - name: signals
  - name: history
  - name: outputs
  - name: alarms
  - name: intents
  - name: actions
  - name: instances
  - name: devices
  - name: apps
  - name: shadows
  - name: generations
  - name: blobs
  - name: runtime
  - name: traces
  - name: jobs
  - name: diagnostics
  - name: uplinks
  - name: micros
  - name: sim
  - name: audit
  - name: streaming
  - name: agent
    description: agente do nó (ref/10) e confiança do nó (ref/09 §5.21)
  - name: reserved
paths:
  # ------------------------------------------------------------------ meta
  /v1/info:
    get:
      tags: [meta]
      operationId: getInfo
      summary: Identidade do nó, versões, geração, relógio, limites e capacidades
      x-joker-role: viewer
      x-joker-cli: [jk status, jk top, todos (arranque de sessão)]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          headers:
            Joker-Generation: {$ref: '#/components/headers/JokerGeneration'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Info'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: Versões de todas as superfícies suportadas (negociação de compatibilidade)
      x-joker-role: viewer
      x-joker-cli: [jk (verificação de compatibilidade)]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Saúde agregada (200 para ok e degraded, 503 para failed)
      x-joker-role: viewer
      x-joker-since: '1.0'
      parameters:
        - name: probe
          in: query
          schema: {type: string, enum: [live, ready, full], default: full}
      responses:
        '200':
          description: ok ou degraded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: failed, ou ainda não pronto (probe=ready)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/whoami:
    get:
      tags: [meta]
      operationId: whoAmI
      summary: Identidade e papel de quem chama
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhoAmI'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/status:
    get:
      tags: [meta]
      operationId: getStatus
      summary: Resumo de operação (jk status)
      x-joker-role: viewer
      x-joker-cli: [jk status]
      x-joker-since: '1.0'
      parameters:
        - name: instances
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: OK
          headers:
            Joker-Generation: {$ref: '#/components/headers/JokerGeneration'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/openapi.json:
    get:
      tags: [meta]
      operationId: getOpenApiJson
      summary: Este documento em JSON
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object}
  /v1/openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenApiYaml
      summary: Este documento em YAML
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/yaml:
              schema: {type: string}
  # ------------------------------------------------------------------ node
  /v1/node:
    get:
      tags: [node]
      operationId: getNode
      summary: Identidade do nó e estado do enrolamento
      x-joker-role: viewer
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/enrollment/csr:
    post:
      tags: [node]
      operationId: createEnrollmentCsr
      summary: Gera (ou roda) a chave do nó e, no primeiro enrolamento, a chave KEM X25519; devolve um CSR PKCS#10 (só pelo canal de arranque)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-transports: [unix]
      x-joker-cli: [jk node enroll]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
        - $ref: '#/components/parameters/JokerEnrollCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentCsrRequest'}
      responses:
        '200':
          description: CSR gerado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentCsr'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/enrollment/certificate:
    put:
      tags: [node]
      operationId: installEnrollmentCertificate
      summary: Instala a cadeia emitida pela CA da organização, as âncoras e o primeiro bundle (só pelo canal de arranque)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-transports: [unix]
      x-joker-cli: [jk node enroll]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
        - $ref: '#/components/parameters/JokerEnrollCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentCertificate'}
      responses:
        '200':
          description: Instalado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/enrollment/deck:
    post:
      tags: [node]
      operationId: enrollWithDeck
      summary: Enrola o nó num Deck com um token (ref/10 §3.1.2); o nó faz o POST /enroll
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-transports: [unix]
      x-joker-cli: [jk node enroll --deck]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
        - $ref: '#/components/parameters/JokerEnrollCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeckEnrollRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/renew:
    post:
      tags: [node]
      operationId: renewNode
      summary: Renova já o certificado do nó (a chave KEM mantém-se)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk node renew]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenewRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/hardware:
    get:
      tags: [node]
      operationId: getNodeHardware
      summary: Inventário do hardware do nó, só com leituras de /proc, /sys e /dev
      description: >-
        Arquitetura, modelo, CPUs, memória, kernel, linha de arranque, chips GPIO (com as linhas já
        ocupadas), LEDs, zonas térmicas, watchdogs, portas série (com os caminhos by-id), I2C, SPI,
        interfaces de rede, dispositivos USB e TPM. Lido a cada pedido; nada é aberto para escrita e
        nenhuma linha GPIO é reservada. Um campo ilegível vem null e aparece em unreadable.
        Referência - docs/ref/09-api-http.md §5.2; uso - jk board probe e jk board check --node (ref/03 §2.3.7).
      x-joker-role: viewer
      x-joker-cli: [jk board probe, jk board check --node]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeHardware'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/trust:
    get:
      tags: [agent]
      operationId: getNodeTrust
      summary: Âncoras, bundle de confiança ativo, pisos e chaves revogadas
      x-joker-role: viewer
      x-joker-cli: [jk node trust show]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustState'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/trust/bundle:
    put:
      tags: [agent]
      operationId: pushTrustBundle
      summary: Instala um bundle de confiança (COSE_Sign1 assinado por uma âncora, version maior)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk node trust push]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/cose:
            schema: {type: string, contentMediaType: application/cose}
      responses:
        '200':
          description: Instalado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustState'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/node/trust/anchors:
    put:
      tags: [agent]
      operationId: setTrustAnchors
      summary: Troca as âncoras de confiança (documento assinado por uma âncora atual; ref/02 §3.2.3)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk node trust set]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/cose:
            schema: {type: string, contentMediaType: application/cose}
      responses:
        '200':
          description: Âncoras trocadas; node.toml reescrito
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrustState'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/groups:
    get:
      tags: [node]
      operationId: listGroups
      summary: Grupos de ciclo com estatísticas
      x-joker-role: viewer
      x-joker-cli: [jk status, jk top]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Group'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/groups/{group}:
    get:
      tags: [node]
      operationId: getGroup
      x-joker-role: viewer
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GroupName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Group'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/metrics:
    get:
      tags: [node]
      operationId: getMetrics
      summary: Instantâneo das métricas da runtime, incluindo histogramas (jk top)
      x-joker-role: viewer
      x-joker-cli: [jk top]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metrics'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/logs:
    get:
      tags: [node]
      operationId: listLogs
      summary: Logs estruturados do anel da API (jk logs); para seguir, tópico logs em /v1/ws ou /v1/stream
      x-joker-role: viewer
      x-joker-cli: [jk logs, jk app logs, jk dev]
      x-joker-since: '1.0'
      parameters:
        - name: source
          in: query
          description: jokerd, app:<a>, driver:<d>, micro:<d>, api
          schema: {type: string}
        - name: app
          in: query
          schema: {$ref: '#/components/schemas/Name'}
        - name: level
          in: query
          schema: {$ref: '#/components/schemas/LogLevel'}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LogEntry'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/LogEntry'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: Registo de auditoria da API (pedidos que mudam estado, sessões, recusas)
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - name: principal
          in: query
          schema: {type: string}
        - name: operation
          in: query
          description: operationId
          schema: {type: string}
        - name: outcome
          in: query
          schema: {type: string, enum: [ok, refused, error]}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEntry'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/AuditEntry'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sessions:
    get:
      tags: [audit]
      operationId: listSessions
      summary: Sessões ativas (ligações HTTP persistentes, WebSocket, SSE, túnel)
      x-joker-role: admin
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sessions/{session}:
    delete:
      tags: [audit]
      operationId: closeSession
      summary: Fecha uma sessão (WebSocket fechado com 4009)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      responses:
        '204': {description: Fechada}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/secrets:
    get:
      tags: [node]
      operationId: listSecrets
      summary: Nomes dos segredos e metadados; nunca os valores
      x-joker-role: admin
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SecretEntry'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [node]
      operationId: pushSecrets
      summary: Recebe um secret-bundle (joker.secrets.v1) com as entradas cifradas para este nó
      description: >-
        Cada entrada é verificada sozinha (ref/02 §3.4.3): assinatura do papel secrets, wrap para este nó,
        decifração de teste e rev. O valor em claro nunca atravessa a API (ref/00 §9).
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk secret push, jk apply]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/vnd.joker.secrets.v1+cbor:
            schema: {type: string, contentMediaType: application/vnd.joker.secrets.v1+cbor}
      responses:
        '200':
          description: Resultado por entrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretPushResult'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/secrets/{secret}:
    put:
      tags: [node]
      operationId: putSecret
      summary: Define um segredo a partir de uma entrada cifrada por HPKE para a chave KEM do nó (nunca em claro)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SecretName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SealedSecret'}
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretEntry'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [node]
      operationId: deleteSecret
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SecretName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      responses:
        '204': {description: Apagado}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ signals
  /v1/signals:
    get:
      tags: [signals]
      operationId: listSignals
      summary: Registo de sinais da geração em execução (metadados; valores com values=true)
      x-joker-role: viewer
      x-joker-cli: [jk read, jk explain, jk dev]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/Sel'
        - name: direction
          in: query
          schema: {$ref: '#/components/schemas/Direction'}
        - name: origin
          in: query
          schema: {$ref: '#/components/schemas/OriginKind'}
        - name: device
          in: query
          schema: {$ref: '#/components/schemas/Name'}
        - name: instance
          in: query
          schema: {$ref: '#/components/schemas/Name'}
        - name: shape
          in: query
          schema: {$ref: '#/components/schemas/Shape'}
        - name: values
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Mono'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Joker-Generation: {$ref: '#/components/headers/JokerGeneration'}
          content:
            application/json:
              schema:
                type: object
                required: [generation, registry, items, next_cursor]
                properties:
                  generation: {$ref: '#/components/schemas/GenerationRef'}
                  registry: {$ref: '#/components/schemas/Digest'}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SignalMeta'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        '400': {$ref: '#/components/responses/BadRequest'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/signals/{path}:
    get:
      tags: [signals]
      operationId: getSignal
      summary: Metadados e amostra atual de um sinal (caminho canónico ou alias)
      x-joker-role: viewer
      x-joker-cli: [jk read, jk explain]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SignalPath'
        - $ref: '#/components/parameters/Mono'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalMeta'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/signals/{path}/lineage:
    get:
      tags: [signals]
