          schema: {$ref: '#/components/schemas/Name'}
      responses:
        '501': {$ref: '#/components/responses/NotImplemented'}
  /v1/signals/{path}/blocks:
    get:
      tags: [reserved]
      operationId: getSignalBlocks
      summary: Reserved for 1.1 (block signals, M7)
      x-joker-role: viewer
      x-joker-since: '1.1'
      parameters:
        - $ref: '#/components/parameters/SignalPath'
      responses:
        '501': {$ref: '#/components/responses/NotImplemented'}
  /v1/streams:
    get:
      tags: [reserved]
      operationId: listStreams
      summary: Reserved for 1.1 (streams, M4, and pipelines, M5)
      x-joker-role: viewer
      x-joker-since: '1.1'
      responses:
        '501': {$ref: '#/components/responses/NotImplemented'}
components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: >-
        TCP requires TLS 1.3 with a client certificate issued by the organization CA. On the Unix socket
        there is no HTTP scheme - the role comes from the peer credentials (SO_PEERCRED) and from [security.roles].
  headers:
    JokerGeneration:
      description: Generation running when the request was served, "<gen> sha256:<hex>"
      schema: {type: string, pattern: '^[0-9]+ sha256:[0-9a-f]{64}$'}
    ETag:
      description: Generation hash ("sha256:<hex>" in quotes); used in If-Match
      schema: {type: string}
    Location:
      schema: {type: string}
    IdempotentReplay:
      description: true when the response is the stored one from an earlier request with the same key
      schema: {type: boolean}
  parameters:
    Sel:
      name: sel
      in: query
      description: Path selector (document 02, §9); repeatable; up to 64
      style: form
      explode: true
      schema:
        type: array
        maxItems: 64
        items: {$ref: '#/components/schemas/Selector'}
    SelRequired:
      name: sel
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 64
        items: {$ref: '#/components/schemas/Selector'}
    Mono:
      name: mono
      in: query
      description: adds the monotonic instants (decimal strings in ns) and the boot_id
      schema: {type: boolean, default: false}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    Cursor:
      name: cursor
      in: query
      description: opaque; returned in next_cursor
      schema: {type: string, maxLength: 512}
    Order:
      name: order
      in: query
      schema: {type: string, enum: [asc, desc], default: desc}
    From:
      name: from
      in: query
      schema: {$ref: '#/components/schemas/TimeParam'}
    To:
      name: to
      in: query
      schema: {$ref: '#/components/schemas/TimeParam'}
    Since:
      name: since
      in: query
      description: equivalent to from=-<duration>; exclusive with from
      schema: {$ref: '#/components/schemas/Duration'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {$ref: '#/components/schemas/IdempotencyKey'}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: '#/components/schemas/IdempotencyKey'}
    JokerNonce:
      name: Joker-Nonce
      in: header
      description: ULID; required over TCP and over the tunnel on x-joker-mutating operations (ref/00, §9)
      schema: {$ref: '#/components/schemas/Ulid'}
    JokerTimestamp:
      name: Joker-Timestamp
      in: header
      description: RFC 3339 UTC; must be within ±30 s of the node clock
      schema: {type: string, format: date-time}
    JokerEnrollCode:
      name: Joker-Enroll-Code
      in: header
      required: false
      description: >-
        single-use enrollment code shown by the node (jokerd enroll-code); with it, any
        principal that reaches the socket may enroll; without it, root or joker-admin. Only on the Unix socket:
        there is never an enrollment port open to the network (ref/09 §2.1, ref/02 §3.2.3; J-E1913)
      schema: {type: string, pattern: '^[A-Z2-7]{16}$'}
    IfMatch:
      name: If-Match
      in: header
      description: '"sha256:<hex>" of the generation seen in the preview'
      schema: {type: string}
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: '"sha256:<hex>" of the current generation (optimistic concurrency)'
      schema: {type: string}
    SignalPath:
      name: path
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SignalPath'}
    GroupName:
      name: group
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Name'}
    AlarmId:
      name: alarm
      in: path
      required: true
      schema: {$ref: '#/components/schemas/AlarmId'}
    IntentId:
      name: intent
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    ActionTarget:
      name: target
      in: path
      required: true
      description: device or instance (they share the namespace, document 16, P3)
      schema: {$ref: '#/components/schemas/Name'}
    ActionName:
      name: action
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Name'}
    InvocationId:
      name: invocation
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    InstanceName:
      name: instance
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Name'}
    MethodName:
      name: method
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Name'}
    DeviceName:
      name: device
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Name'}
    AppName:
      name: app
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Name'}
    GenRef:
      name: gen
      in: path
      required: true
      schema: {$ref: '#/components/schemas/GenSelector'}
    BlobDigest:
      name: digest
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Digest'}
    UploadId:
      name: upload
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    TraceId:
      name: trace
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    JobId:
      name: job
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    SessionId:
      name: session
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    SecretName:
      name: secret
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Name'}
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    BadRequest:
      description: Malformed request (J-E101x, J-E103x)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Insufficient role, origin refused or transport not allowed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State does not allow the operation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: If-Match does not match the current generation (J-E1026)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: If-Match missing (J-E1027)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooLarge:
      description: Body or chunk above the limit (J-E1009, J-E1606)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RangeNotSatisfiable:
      description: Content-Range invalid or out of order (J-E1605)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: Semantically invalid (validation, J-codes, limits)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Rate limit (J-E1014); see Retry-After
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: Unavailable (startup, full queue, MCU disconnected)
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Timeout:
      description: Timed out (J-E1016)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InsufficientStorage:
      description: Trace quota exhausted (J-E1703)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotImplemented:
      description: Feature reserved or not in this build (J-E1017)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    JobAccepted:
      description: Job created; follow it at Location or on the jobs topic
      headers:
        Location:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
  schemas:
    # ---------------------------------------------------------------- primitives
    Name:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}$'
    NodeName:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    SignalPath:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}(\.[a-z][a-z0-9_]{0,31}){0,7}$'
    Selector:
      description: '* matches part of one segment ([a-z0-9_]*); ** matches one or more whole segments'
      type: string
      maxLength: 288
      pattern: '^(\*\*|[a-z*][a-z0-9_*]{0,31})(\.(\*\*|[a-z*][a-z0-9_*]{0,31})){0,7}$'
    AlarmId:
      description: alarm name from the manifest (grid_overfreq), the runtime (joker.device.pcs.offline) or an app (app.<app>.<name>)
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}(\.[a-z][a-z0-9_]{0,31}){0,7}$'
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    IdempotencyKey:
      type: string
      pattern: '^[\x20-\x7E]{1,64}$'
    Duration:
      description: duration literal (ref/00, §3.1)
      type: string
      pattern: '^[0-9]+(\.[0-9]+)? ?(ns|us|µs|ms|s|m|min|h|d)$'
    Timestamp:
      type: string
      format: date-time
    TimeParam:
      description: RFC 3339 (with Z or offset), "now", or relative "-<duration>"
      type: string
      pattern: '^(now|-[0-9]+(\.[0-9]+)? ?(ns|us|µs|ms|s|m|min|h|d)|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+(Z|[+-][0-9]{2}:[0-9]{2}))$'
    MonoNs:
      description: monotonic instant in ns, decimal string (ref/00, §3)
      type: string
      pattern: '^[0-9]{1,20}$'
    NextCursor:
      type: [string, 'null']
    Level:
      description: '"<band>:<level>" (ref/00, §5)'
      type: string
      pattern: '^(safety:[1-2]|manual:[3-5]|supervisor:[6-8]|control:(9|1[0-2])|optimizer:1[3-5]|schedule:16)$'
    LevelOrNone:
      oneOf:
        - $ref: '#/components/schemas/Level'
        - type: string
          const: none
    ManualLevel:
      type: string
      pattern: '^manual:[3-5]$'
    Role:
      type: string
      enum: [viewer, operator, admin]
    QualityCode:
      type: string
      enum: [good, uncertain, bad]
    QualityReason:
      type: string
      enum: [none, overridden, local_override, stale, not_confirmed, substituted, out_of_distribution,
             sensor_cal, clock_unsynced, initial, frozen, partial_write, comm_failure, device_fault,
             out_of_range, config_error, not_connected, nan, tripped, deadline]
    ClockQuality:
      type: string
      enum: [synced, holdover, unsynced]
    Severity:
      type: string
      enum: [low, medium, high, critical]
    AlarmState:
      type: string
      enum: [normal, active_unacked, active_acked, rtn_unacked, unknown]
    WriterKind:
      type: string
      enum: [cycle, async, manual, bridge, impl, proposal]
    GenerationState:
      description: generation_state (ref/00 §6); discarded = pending one discarded, superseded or expired
      type: string
      enum: [pending, confirming, confirmed, rolled_back, failed, discarded]
    SignalType:
      type: string
      enum: [bool, i64, u64, f64, f32, enum, bits, string, bytes]
    Shape:
      description: block and stream reserved for 1.1 (document 11, "Ready for ML")
      type: string
      enum: [scalar, event, block, stream]
    Direction:
      type: string
      enum: [input, output, param, internal]
    OriginKind:
      type: string
      enum: [device, app, calc, alarm, bridge, pipeline, runtime, instance]
    Outcome:
      type: string
      enum: [none, accepted, clamped_range, clamped_rate, suppressed, overridden, deferred, shadowed, rejected, tripped]
    RejectReason:
      type: string
      enum: [wrong_type, interlock, quality, range, atomic_group, not_owner, clock_unsynced, budget]
    Value:
      description: >-
        Value in JSON (ref/00, §4.1). Numbers in the signal unit; i64/u64 outside ±2^53 as a decimal string;
        enum by variant name; string as its text; bytes in base64 (RFC 4648 §4, standard alphabet, padded;
        ADR 0062); null only with quality bad(nan) or no value.
      type: [boolean, number, string, 'null']
    ValueInput:
      description: >-
        Input value. Number in the signal unit, quantity literal ("50 kW", converted; wrong dimension
        is J0107), boolean, variant name, decimal string for large integers, the text for string, base64
        (RFC 4648 §4, standard alphabet, padded) for bytes; string and bytes up to 64 B, otherwise J-E1036
        (ADR 0062).
      type: [boolean, number, string]
    GenSelector:
      type: string
      pattern: '^([0-9]+|sha256:[0-9a-f]{64}|current|previous|pending|confirming)$'
    GenerationRef:
      type: object
      required: [gen, hash]
      properties:
        gen: {type: integer, minimum: 1}
        hash: {$ref: '#/components/schemas/Digest'}
        state: {$ref: '#/components/schemas/GenerationState'}
    Principal:
      type: object
      required: [id, transport]
      properties:
        id:
          description: >-
            writer identifier (user:<principal>, ref/00 §5); over the tunnel, the pre-authenticated principal
            deck:<deck_id>/user:<id> (ref/10 §3.10)
          type: string
          pattern: '^user:([A-Za-z0-9._@-]{1,64}|deck:[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?/user:[A-Za-z0-9._@-]{1,64})$'
        transport:
          type: string
          enum: [unix, tcp, tunnel]
        subject:
          description: certificate DN (tcp), Unix user (unix) or Deck user (tunnel)
          type: string
        fingerprint:
          description: SHA-256 of the client certificate (tcp)
          type: string
        uid: {type: integer}
        deck: {$ref: '#/components/schemas/NodeName'}
    # ---------------------------------------------------------------- problem
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          description: urn:joker:code:<code>
          type: string
          format: uri
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance:
          description: urn:joker:request:<ULID>
          type: string
        code:
          description: J-code from the registry (codes.toml)
          type: string
          pattern: '^(J[0-9]{4}|JC[0-9]{4}|JW[0-9]{4}|W[0-9]{4}|J-E[0-9]{4})$'
        severity:
          type: string
          enum: [error, warning]
        help: {type: string}
        pointer:
          description: JSON Pointer (RFC 6901) to the request field concerned
          type: string
        param:
          description: query parameter or header concerned
          type: string
        spans:
          type: array
          items: {$ref: '#/components/schemas/Span'}
        errors:
          description: individual diagnostics (generation validation, several fields)
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
        suggestions:
          type: array
          items: {type: string}
        retry_after:
          $ref: '#/components/schemas/Duration'
        request_id: {$ref: '#/components/schemas/Ulid'}
    Span:
      type: object
      required: [file, line, column]
      properties:
        file: {type: string}
        line: {type: integer, minimum: 1}
        column: {type: integer, minimum: 1}
        end_line: {type: integer, minimum: 1}
        end_column: {type: integer, minimum: 1}
        label: {type: string}
    Diagnostic:
      type: object
      required: [code, severity, message]
      properties:
        code: {type: string}
        severity:
          type: string
          enum: [error, warning, error_in_prod]
        message: {type: string}
        help: {type: string}
        key:
          description: effective manifest key in dotted notation
          type: string
        spans:
          type: array
          items: {$ref: '#/components/schemas/Span'}
    # ---------------------------------------------------------------- meta
    Info:
      type: object
      required: [node, runtime, api, mode, generation, clock, limits, features, caller]
      properties:
        node: {$ref: '#/components/schemas/NodeName'}
        site: {$ref: '#/components/schemas/NodeName'}
        runtime:
          type: object
          required: [version, boot_id, started_at]
          properties:
            version: {type: string}
            commit: {type: string}
            build_features:
              type: array
              items: {type: string}
            boot_id: {$ref: '#/components/schemas/Ulid'}
            boot_count:
              description: startup counter of the state directory, after this start's increment (docs/01 §20, ADR 0070)
              type: integer
              minimum: 1
            started_at: {$ref: '#/components/schemas/Timestamp'}
        api:
          type: object
          required: [version, base]
          properties:
            version: {type: string, examples: ['1.0.0']}
            base: {type: string, const: /v1}
        mode:
          type: string
          enum: [dev, prod]
        board: {type: string}
        arch: {type: string}
        kernel:
          type: object
          properties:
            release: {type: string}
            preempt_rt: {type: boolean}
        generation: {$ref: '#/components/schemas/GenerationRef'}
        clock: {$ref: '#/components/schemas/Clock'}
        limits: {$ref: '#/components/schemas/Limits'}
        features:
          description: >-
            API capabilities on this node (sse, intents, micro, sim, agent, enroll.code; 1.1 shadow.apps, models,
            blocks, streams, schedule; 1.3 tunnel)
          type: array
          items: {type: string}
        caller: {$ref: '#/components/schemas/WhoAmI'}
    Clock:
      type: object
      required: [quality, utc, mono_ns]
      properties:
        quality: {$ref: '#/components/schemas/ClockQuality'}
        source:
          type: string
          enum: [ntp, ptp, gnss, none]
        utc: {$ref: '#/components/schemas/Timestamp'}
        mono_ns: {$ref: '#/components/schemas/MonoNs'}
        holdover_since: {$ref: '#/components/schemas/Timestamp'}
        last_sync: {$ref: '#/components/schemas/Timestamp'}
        offset: {$ref: '#/components/schemas/Duration'}
    Limits:
      type: object
      properties:
        max_body: {type: string, examples: ['16 MiB']}
        max_chunk: {type: string, examples: ['8 MiB']}
        max_selectors: {type: integer, examples: [64]}
        max_resolved_signals: {type: integer, examples: [10000]}
        max_coherent: {type: integer, examples: [256]}
        max_history_points: {type: integer, examples: [100000]}
        max_page: {type: integer, examples: [1000]}
        ws_max_subscriptions: {type: integer, examples: [64]}
        ws_min_interval: {$ref: '#/components/schemas/Duration'}
        max_connections_per_principal: {type: integer, examples: [16]}
        replay_window: {$ref: '#/components/schemas/Duration'}
    Version:
      type: object
      required: [runtime, api, wit, lock, manifest, agent, link, trace]
      properties:
        runtime: {type: string}
        api:
          type: object
          required: [current, supported]
          properties:
            current: {type: string}
            supported:
              type: array
              items: {type: string}
        wit:
          type: object
          required: [current, supported]
          properties:
            current: {type: string, examples: ['joker:runtime@1.0.0']}
            supported:
              type: array
              items: {type: string}
        driver_wit:
          type: array
          items: {type: string}
        jdp:
          type: array
          items: {type: integer}
        manifest:
          description: accepted [project] joker versions (current and previous)
          type: array
          items: {type: string}
        lock:
          type: array
          items: {type: integer}
        agent: {type: string, examples: [agent/1]}
        link:
          type: object
          properties:
            current: {type: string}
            supported:
              type: array
              items: {type: string}
        abi:
          type: object
          properties:
            major: {type: integer}
            minor: {type: integer}
        trace:
          type: array
          items: {type: integer}
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, failed]
        checks:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id:
                type: string
                examples: [groups, devices, apps, store, uplinks, clock, disk, micros, generation]
              status:
                type: string
                enum: [ok, degraded, failed]
              detail: {type: string}
    WhoAmI:
      type: object
      required: [principal, role, session]
      properties:
        principal: {$ref: '#/components/schemas/Principal'}
        role: {$ref: '#/components/schemas/Role'}
        session: {$ref: '#/components/schemas/Ulid'}
        matched:
          description: '[security.roles] rules that granted the role'
          type: array
          items: {type: string}
    Status:
      type: object
      required: [node, generation, clock, groups, devices, apps, alarms, trips, manual]
      properties:
        node: {$ref: '#/components/schemas/NodeName'}
        runtime:
          type: object
          properties:
            version: {type: string}
            slot:
              type: string
              enum: [a, b]
        generation:
          allOf:
            - $ref: '#/components/schemas/GenerationRef'
          properties:
            confirm_deadline: {$ref: '#/components/schemas/Timestamp'}
            pending: {$ref: '#/components/schemas/GenerationRef'}
        clock: {$ref: '#/components/schemas/Clock'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/Group'}
        devices:
          type: array
          items:
            type: object
            required: [name, link]
            properties:
              name: {$ref: '#/components/schemas/Name'}
              link: {$ref: '#/components/schemas/LinkState'}
              since: {$ref: '#/components/schemas/Timestamp'}
              quality: {$ref: '#/components/schemas/QualityCode'}
              reason: {$ref: '#/components/schemas/QualityReason'}
              timeouts: {type: string, examples: [3/3]}
              reconnects:
                description: successful connects after the first one, since the generation started (ADR 0063)
                type: integer
              dropped_samples:
                description: samples the sample ring of the device refused (ADR 0063)
                type: integer
              invalid_samples:
                description: samples that broke ref/06 §2.8, J0869 (ADR 0063)
                type: integer
        apps:
          type: array
          items:
            type: object
            required: [name, version, state]
            properties:
              name: {$ref: '#/components/schemas/Name'}
              version: {type: string}
              state: {$ref: '#/components/schemas/AppState'}
        alarms:
          type: object
          required: [active, unacked, items]
          properties:
            active: {type: integer}
            unacked: {type: integer}
            items:
              description: up to 20, by severity and age
              type: array
              items: {$ref: '#/components/schemas/Alarm'}
        trips:
          type: array
          items: {$ref: '#/components/schemas/Trip'}
        manual:
          type: array
          items: {$ref: '#/components/schemas/ManualOverride'}
        instances:
          type: array
          items: {$ref: '#/components/schemas/Instance'}
        uplinks:
          type: array
          items: {$ref: '#/components/schemas/Uplink'}
        micros:
          type: array
          items: {$ref: '#/components/schemas/Micro'}
    Group:
      type: object
      required: [name, period]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        period: {$ref: '#/components/schemas/Duration'}
        resources: {type: string}
        cpus:
          type: array
          items: {type: integer}
        priority: {type: integer}
        overrun:
          type: string
          enum: [skip, catch_up, degrade, trip]
        trip_after: {type: integer}
        tripped: {type: boolean}
        order:
          type: array
          items: {type: string}
        tasks:
          type: array
          items:
            type: object
            required: [app, task]
            properties:
              app: {$ref: '#/components/schemas/Name'}
              task: {$ref: '#/components/schemas/Name'}
              wcet_declared: {$ref: '#/components/schemas/Duration'}
              wcet_lock: {$ref: '#/components/schemas/Duration'}
              wcet_measured_p999: {$ref: '#/components/schemas/Duration'}
              overruns: {type: integer}
        stats: {$ref: '#/components/schemas/GroupStats'}
        trace_ring:
          type: object
          properties:
            continuous: {$ref: '#/components/schemas/Duration'}
            covered_from: {$ref: '#/components/schemas/Timestamp'}
    GroupStats:
      type: object
      properties:
        ticks: {type: integer}
        overruns: {type: integer}
        consecutive_overruns: {type: integer}
        jitter: {$ref: '#/components/schemas/Percentiles'}
        duration: {$ref: '#/components/schemas/Percentiles'}
    Percentiles:
      type: object
      properties:
        p50: {$ref: '#/components/schemas/Duration'}
        p99: {$ref: '#/components/schemas/Duration'}
        p999: {$ref: '#/components/schemas/Duration'}
        max: {$ref: '#/components/schemas/Duration'}
        window: {$ref: '#/components/schemas/Duration'}
    Metrics:
      type: object
      required: [at]
      properties:
        at: {$ref: '#/components/schemas/Timestamp'}
        groups:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/GroupStats'
            properties:
              group: {$ref: '#/components/schemas/Name'}
        drivers:
          type: array
          items:
            type: object
            properties:
              device: {$ref: '#/components/schemas/Name'}
              link: {$ref: '#/components/schemas/LinkState'}
              latency: {$ref: '#/components/schemas/Percentiles'}
              timeouts: {type: integer}
              reconnects: {type: integer}
              dropped_samples:
                description: samples the sample ring of the device refused (ADR 0063)
                type: integer
              invalid_samples:
                description: samples that broke ref/06 §2.8, J0869 (ADR 0063)
                type: integer
              bytes_rx: {type: integer}
              bytes_tx: {type: integer}
              coalescing: {type: number, description: useful / read registers}
        envelope:
          type: array
          items:
            type: object
            properties:
              output: {$ref: '#/components/schemas/SignalPath'}
              accepted: {type: integer}
              clamped: {type: integer}
              rejected: {type: integer}
              suppressed: {type: integer}
              tripped: {type: integer}
        arbiter:
          type: object
          properties:
            manual_active: {type: integer}
            leases_expiring: {type: integer}
        apps:
          type: array
          items:
            type: object
            properties:
              app: {$ref: '#/components/schemas/Name'}
              traps: {type: integer}
              restarts: {type: integer}
              memory: {type: string}
              cpu_async: {$ref: '#/components/schemas/Duration'}
        store:
          type: object
          properties:
            queue: {type: integer}
            dropped: {type: integer}
            disk_used: {type: string}
        api:
          type: object
          properties:
            connections: {type: integer}
            subscriptions: {type: integer}
            sampled_per_s: {type: integer}
            dropped: {type: integer}
            rate_limited: {type: integer}
        system:
          type: object
          properties:
            temp: {type: string, examples: ['61 °C']}
            throttled: {type: boolean}
            memory_used: {type: string}
            disk_free: {type: string}
        runtime:
          description: the daemon's own queues (ADR 0090)
          type: object
          properties:
            dropped:
              description: drops of each internal queue, by queue name (decisions, write_results, trace, alarm_events, method_results, reset_results, trip_requests, confirmations, write_acks, logs)
              type: object
              additionalProperties: {type: integer}
        ml:
          description: reserved for 1.1; null in 1.0
          type: ['null', object]
    # ---------------------------------------------------------------- node, audit, sessions, secrets, logs
    Node:
      type: object
      required: [name, enrolled]
      properties:
        name: {$ref: '#/components/schemas/NodeName'}
        site: {$ref: '#/components/schemas/NodeName'}
        enrolled: {type: boolean}
        identity:
          type: object
          properties:
            subject: {type: string}
            issuer: {type: string}
            fingerprint: {type: string}
            not_after: {$ref: '#/components/schemas/Timestamp'}
            key_storage:
              type: string
              enum: [tpm, secure_element, file]
            chain_pem:
              description: node certificate chain (leaf first), with the KEM key in the SAN URI urn:joker:kem:x25519:… (ref/02 §3.4.2)
              type: string
            kem_key:
              description: X25519 public key for secrets (x25519:<base64>), the same as in the SAN
              type: string
        board: {type: string}
        arch: {type: string}
        os: {type: string}
    NodeHardware:
      description: node hardware inventory (ref/09 §5.2); reads only
      type: object
      required: [collected_at, arch, machine, cpus, memory, kernel, cmdline, gpio_chips, leds, thermal_zones, watchdogs, serial, i2c, spi, net, usb, tpm, unreadable]
      properties:
        collected_at: {$ref: '#/components/schemas/Timestamp'}
        arch:
          description: normalized to the [board] arch values (ref/03 §2.3.1); other if none matches
          type: string
          enum: [aarch64, x86_64, armv7, armv6, riscv64, other]
        machine:
          description: raw value of uname -m (armv6l, aarch64)
          type: string
        model:
          description: /proc/device-tree/model without the trailing NUL; on x86, /sys/class/dmi/id/product_name
          type: ['string', 'null']
          examples: ['Raspberry Pi Zero W Rev 1.1']
        compatible:
          description: /proc/device-tree/compatible
          type: array
          items: {type: string}
        cpus:
          type: object
          required: [count]
          properties:
            count: {type: integer, minimum: 1, description: CPUs online}
            possible: {type: integer, minimum: 1}
            model: {type: ['string', 'null'], description: /proc/cpuinfo}
            max_freq: {type: ['string', 'null'], description: 'quantity, e.g. "1 GHz" (cpufreq/cpuinfo_max_freq)'}
            isolated:
              description: /sys/devices/system/cpu/isolated
              type: array
              items: {type: integer, minimum: 0}
            nohz_full:
              type: array
              items: {type: integer, minimum: 0}
        memory:
          type: object
          required: [total]
          properties:
            total: {type: string, description: 'MemTotal in IEC, e.g. "427 MiB"'}
            available: {type: string}
        kernel:
          type: object
          required: [release, preempt_rt]
          properties:
            release: {type: string, examples: ['6.12.25+rpt-rpi-v6']}
            version: {type: string, description: uname -v}
            preempt_rt: {type: boolean, description: '/sys/kernel/realtime = 1, or PREEMPT_RT in uname -v'}
            preempt:
              type: ['string', 'null']
              enum: [none, voluntary, full, rt, null]
        cmdline:
          description: /proc/cmdline, split into boot lines
          type: array
          items: {type: string}
        boot_params:
          description: the boot lines that jk doctor --rt knows, by name
          type: object
          properties:
            isolcpus: {type: ['string', 'null']}
            nohz_full: {type: ['string', 'null']}
            rcu_nocbs: {type: ['string', 'null']}
            irqaffinity: {type: ['string', 'null']}
        gpio_chips:
          type: array
          items:
            type: object
            required: [path, name, label, lines, used]
            properties:
              path: {type: string, examples: [/dev/gpiochip0]}
              name: {type: string, examples: [gpiochip0]}
              label: {type: string, examples: [pinctrl-bcm2835]}
              lines: {type: integer, minimum: 0}
              named: {type: integer, minimum: 0, description: named lines}
              used:
                description: lines already requested by the kernel or by another process (GPIO_V2_GET_LINEINFO_IOCTL, without reserving them)
                type: array
                items:
                  type: object
                  required: [offset]
                  properties:
                    offset: {type: integer, minimum: 0}
                    name: {type: ['string', 'null']}
                    consumer: {type: ['string', 'null'], examples: [ACT]}
        leds:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: {type: string, examples: [ACT]}
              max_brightness: {type: integer, minimum: 0}
              trigger: {type: ['string', 'null'], examples: [mmc0]}
              gpio:
                type: ['object', 'null']
                properties:
                  chip: {type: string}
                  offset: {type: integer, minimum: 0}
        thermal_zones:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: {type: string, examples: [thermal_zone0]}
              type: {type: string, examples: [cpu-thermal]}
              temp: {type: ['string', 'null'], description: 'quantity in °C, read now'}
        watchdogs:
          type: array
          items:
            type: object
            required: [device]
            properties:
              device: {type: string, examples: [/dev/watchdog0]}
              identity: {type: ['string', 'null'], examples: [bcm2835-wdt]}
              timeout: {oneOf: [{$ref: '#/components/schemas/Duration'}, {type: 'null'}]}
              min_timeout: {oneOf: [{$ref: '#/components/schemas/Duration'}, {type: 'null'}]}
              max_timeout: {oneOf: [{$ref: '#/components/schemas/Duration'}, {type: 'null'}]}
              nowayout: {type: boolean}
              active: {type: boolean, description: already armed by someone}
        serial:
          type: array
          items:
            type: object
            required: [path, soc]
            properties:
              path: {type: string, examples: [/dev/ttyUSB0]}
              aliases:
                description: stable links pointing to the port (/dev/serial0, /dev/serial/by-id/…)
                type: array
                items: {type: string}
              driver: {type: ['string', 'null'], examples: [cp210x]}
              soc: {type: boolean, description: 'board UART (true) or adapter (false)'}
              usb:
                type: ['object', 'null']
                properties:
                  vendor_id: {type: string, pattern: '^[0-9a-f]{4}$'}
                  product_id: {type: string, pattern: '^[0-9a-f]{4}$'}
                  serial: {type: ['string', 'null']}
        i2c:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path: {type: string, examples: [/dev/i2c-1]}
              name: {type: ['string', 'null']}
        spi:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path: {type: string, examples: [/dev/spidev0.0]}
              bus: {type: integer, minimum: 0}
              cs: {type: integer, minimum: 0}
        net:
          type: array
          items:
            type: object
            required: [name, kind]
            properties:
              name: {type: string, examples: [wlan0]}
              kind:
                type: string
                enum: [ethernet, wifi, loopback, virtual, other]
              mac: {type: ['string', 'null']}
              up: {type: boolean}
              usb: {type: boolean, description: the interface is behind USB}
              addresses:
                type: array
                items: {type: string}
        usb:
          type: array
          items:
            type: object
            required: [vendor_id, product_id]
            properties:
              bus: {type: integer}
              port: {type: string}
              vendor_id: {type: string, pattern: '^[0-9a-f]{4}$'}
              product_id: {type: string, pattern: '^[0-9a-f]{4}$'}
              manufacturer: {type: ['string', 'null']}
              product: {type: ['string', 'null']}
              class: {type: ['string', 'null']}
        tpm:
          type: object
          required: [present]
          properties:
            present: {type: boolean}
            version: {type: ['string', 'null'], examples: ['2.0']}
            device: {type: ['string', 'null'], examples: [/dev/tpmrm0]}
        storage:
          description: the disk the root file system is mounted from, and its medium (ADR 0092); null when the root device cannot be told
          type: ['object', 'null']
          required: [device, medium]
          properties:
            device: {type: string, examples: [/dev/mmcblk0]}
            medium:
              description: 'sd or emmc from /sys/block/<dev>/device/type (SD, MMC); ssd for NVMe and SATA; null when unknown'
              type: ['string', 'null']
              enum: [sd, emmc, ssd, null]
        unreadable:
          type: array
          items:
            type: object
            required: [field, reason]
            properties:
              field: {type: string}
              path: {type: string}
              reason:
                type: string
                enum: [permission, absent, error]
    EnrollmentCsrRequest:
      type: object
      additionalProperties: false
      properties:
        node: {$ref: '#/components/schemas/NodeName'}
        rotate:
          description: generates a new key even if one already exists (rotation)
          type: boolean
          default: false
        key_storage:
          type: string
          enum: [auto, tpm, secure_element, file]
          default: auto
    EnrollmentCsr:
      type: object
      required: [csr_pem, key_storage]
      properties:
        csr_pem: {type: string}
        key_storage:
          type: string
          enum: [tpm, secure_element, file]
        public_key_fingerprint: {type: string}
    EnrollmentCertificate:
      type: object
      required: [chain_pem]
      additionalProperties: false
      properties:
        chain_pem:
          description: PEM chain, leaf first; the leaf has the KEM key in the SAN URI urn:joker:kem:x25519:<base64url>
          type: string
        client_ca_pem:
          description: CA that the node starts accepting for API clients over TCP
          type: string
        anchors:
          description: trust anchors (Ed25519 public keys in PEM), written to trust.anchors in node.toml
          type: array
          items: {type: string}
        trust:
          description: first trust bundle (COSE_Sign1 in base64), signed by one of the anchors
          type: string
          contentEncoding: base64
        allow_dev:
          description: '[policy] allow_dev in node.toml (ref/02); true with a development CA'
          type: boolean
    DeckEnrollRequest:
      type: object
      required: [deck_url, token]
      additionalProperties: false
      properties:
        deck_url: {type: string, format: uri}
        token:
          description: enrollment token jkt1_… (ref/10 §2.5.1); never appears in logs or in the audit
          type: string
        force:
          description: re-enrolls a node already enrolled (new key)
          type: boolean
          default: false
    RenewRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 1024}
    TrustState:
      type: object
      required: [anchors]
      properties:
        anchors:
          type: array
          items: {type: string, description: 'key id (ed25519:<32 hex>)'}
        bundle:
          type: ['null', object]
          properties:
            version: {type: integer}
            org: {type: string}
            authority: {type: string}
            issued: {$ref: '#/components/schemas/Timestamp'}
            min_mode:
              type: string
              enum: [dev, prod]
            deck_urls:
              type: array
              items: {type: string}
            keys:
              type: array
              items:
                type: object
                properties:
                  kid: {type: string}
                  roles:
                    type: array
                    items:
                      type: string
                      enum: [root, deck, runtime, apps, config, profiles, boards, classes, firmware, models, drivers, secrets]
                  not_after: {$ref: '#/components/schemas/Timestamp'}
                  deck: {type: string}
        floors:
          description: seq of the applied floor, by role and scope
          type: object
          additionalProperties: {type: integer}
        revoked:
          type: array
          items: {type: string}
    AuditEntry:
      type: object
      required: [id, ts, principal, role, operation, outcome, status]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        ts: {$ref: '#/components/schemas/Timestamp'}
        principal: {$ref: '#/components/schemas/Principal'}
        role: {$ref: '#/components/schemas/Role'}
        session: {$ref: '#/components/schemas/Ulid'}
        request_id: {$ref: '#/components/schemas/Ulid'}
        operation: {type: string}
        method: {type: string}
        path: {type: string}
        outcome:
          type: string
          enum: [ok, refused, error]
        status: {type: integer}
        code: {type: string}
        summary:
          description: request summary; never secrets
          type: object
        nonce: {$ref: '#/components/schemas/Ulid'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        replay_check:
          type: string
          enum: [checked, not_required, clock_holdover, clock_unsynced]
    Session:
      type: object
      required: [id, principal, role, kind, connected_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        principal: {$ref: '#/components/schemas/Principal'}
        role: {$ref: '#/components/schemas/Role'}
        kind:
          type: string
          enum: [http, ws, sse]
        connected_at: {$ref: '#/components/schemas/Timestamp'}
        remote: {type: string}
        subscriptions: {type: integer}
        dropped: {type: integer}
        resumable_until: {$ref: '#/components/schemas/Timestamp'}
    SecretEntry:
      type: object
      required: [name, set]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        set: {type: boolean}
        rev:
          description: revision of the stored entry (never decreases; ref/02 §3.4.4)
          type: integer
        type:
          type: string
          enum: [string, bytes]
        signer:
          description: id of the secrets-role key that signed the entry
          type: string
        declared: {type: boolean}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        updated_by: {type: string}
        used_by:
          type: array
          items: {type: string}
    SealedSecret:
      type: object
      required: [scheme, sealed]
      additionalProperties: false
      properties:
        scheme:
          description: the HPKE suite of ref/02 §2.4.4
          type: string
          enum: [hpke-x25519-sha256-chacha20poly1305]
        key_id:
          description: id of the node X25519 KEM key (x25519:<32 hex>)
          type: string
        sealed:
          description: >-
            the deterministic CBOR of a secret-entry (spec/cddl/secrets.cddl), with the wrap for this node, in
            base64; the plaintext value never crosses the API
          type: string
          contentEncoding: base64
    SecretPushResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, accepted]
            properties:
              name: {type: string}
              rev: {type: integer}
              accepted: {type: boolean}
              code:
                description: J0922–J0926 (ref/02) when refused
                type: string
    LogLevel:
      type: string
      enum: [trace, debug, info, warn, error]
    LogEntry:
      type: object
      required: [ts, level, source, msg, seq]
      properties:
        seq: {type: integer}
        ts: {$ref: '#/components/schemas/Timestamp'}
        level: {$ref: '#/components/schemas/LogLevel'}
        source: {type: string, examples: [jokerd, 'app:peak_shaver', 'driver:pcs']}
        msg: {type: string}
        fields:
          type: object
          additionalProperties: {type: string}
    # ---------------------------------------------------------------- signals
    Sample:
      description: Sample in JSON (ref/00, §4.2), plus optional fields of this API
      type: object
      required: [path, value, quality, reason, ts_acq, seq]
      properties:
        path: {$ref: '#/components/schemas/SignalPath'}
        value: {$ref: '#/components/schemas/Value'}
        unit: {type: string}
        quality: {$ref: '#/components/schemas/QualityCode'}
        reason: {$ref: '#/components/schemas/QualityReason'}
        ts_src: {$ref: '#/components/schemas/Timestamp'}
        ts_hw: {$ref: '#/components/schemas/Timestamp'}
        ts_acq: {$ref: '#/components/schemas/Timestamp'}
        seq:
          type: [integer, string]
        bits:
          description: named active bits (bits type)
          type: array
          items: {type: string}
        age: {$ref: '#/components/schemas/Duration'}
        acq_id:
          description: acquisition id (only in coherent reads)
          type: integer
        ts_acq_mono_ns: {$ref: '#/components/schemas/MonoNs'}
        ts_hw_mono_ns: {$ref: '#/components/schemas/MonoNs'}
    ValuesQuery:
      type: object
      required: [sel]
      additionalProperties: false
      properties:
        sel:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/Selector'}
        coherent: {type: boolean, default: false}
        mono: {type: boolean, default: false}
    RefreshRequest:
      type: object
      required: [sel]
      additionalProperties: false
      properties:
        sel:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/Selector'}
        timeout:
          $ref: '#/components/schemas/Duration'
    ValuesResponse:
      type: object
      required: [generation, read_at, items]
      properties:
        generation: {$ref: '#/components/schemas/GenerationRef'}
        read_at: {$ref: '#/components/schemas/Timestamp'}
        coherent: {type: boolean}
        boot_id: {$ref: '#/components/schemas/Ulid'}
        items:
          type: array
          items: {$ref: '#/components/schemas/Sample'}
    SignalMeta:
      type: object
      required: [path, canonical, type, shape, direction, origin]
      properties:
        path: {$ref: '#/components/schemas/SignalPath'}
        canonical: {$ref: '#/components/schemas/SignalPath'}
        aliases:
          type: array
          items: {$ref: '#/components/schemas/SignalPath'}
        signal_id:
          description: SignalId, valid only with the response registry
          type: integer
        type: {$ref: '#/components/schemas/SignalType'}
        enum:
          description: variants (enum type), name → numeric value
          type: object
          additionalProperties: {type: integer}
        bits:
          description: named bits (bits type), name → position
          type: object
          additionalProperties: {type: integer}
        unit: {type: string}
        quantity:
          type: string
          enum: [active_power, reactive_power, apparent_power, energy, reactive_energy, temperature, temperature_difference]
        shape: {$ref: '#/components/schemas/Shape'}
        direction: {$ref: '#/components/schemas/Direction'}
        origin:
          type: object
          required: [kind, name]
          properties:
            kind: {$ref: '#/components/schemas/OriginKind'}
            name: {type: string}
        max_age: {$ref: '#/components/schemas/Duration'}
        poll:
          type: string
          description: poll period, or on_demand
        limits:
          type: array
          items: {type: string}
        stuck_detect: {$ref: '#/components/schemas/Duration'}
        record:
          description: historian recording policy (null = not recorded)
          type: ['null', object]
        writable: {type: boolean}
        group:
          description: owning group (outputs and derived signals)
          type: string
        members:
          description: instance members that are aliases of this signal
          type: array
          items: {type: string}
        sample: {$ref: '#/components/schemas/Sample'}
    Lineage:
      type: object
      required: [path, canonical]
      properties:
        path: {$ref: '#/components/schemas/SignalPath'}
        canonical: {$ref: '#/components/schemas/SignalPath'}
        source:
          type: object
          properties:
            driver: {type: string}
            device: {type: string}
            bus: {type: string}
            profile: {type: string}
            register: {type: string}
            poll: {type: string}
            acquisition:
              type: object
              properties:
                scale: {type: number}
                offset: {type: number}
                unit_from: {type: string}
                unit_to: {type: string}
                deadband: {type: string}
        expression:
          description: expression of a calc
          type: string
        readers:
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              kind:
                type: string
                enum: [app, calc, alarm, interlock, requires_good, range, query, bridge, uplink]
              name: {type: string}
              port: {type: string}
              group: {type: string}
        writers:
          type: array
          items: {$ref: '#/components/schemas/WriterDecl'}
        output:
          type: object
          properties:
            group: {type: string}
            readback: {$ref: '#/components/schemas/SignalPath'}
            atomic: {type: string}
    # ---------------------------------------------------------------- history
    Aggregate:
      type: string
      enum: [avg, min, max, first, last, count, quality]
    Tier:
      type: string
      enum: [auto, raw, 1s, 1m, 15m]
    HistoryQuery:
      type: object
      required: [sel]
      additionalProperties: false
      properties:
        sel:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/Selector'}
        from: {$ref: '#/components/schemas/TimeParam'}
        to: {$ref: '#/components/schemas/TimeParam'}
        since: {$ref: '#/components/schemas/Duration'}
        step: {$ref: '#/components/schemas/Duration'}
        agg:
          type: array
          items: {$ref: '#/components/schemas/Aggregate'}
        tier: {$ref: '#/components/schemas/Tier'}
        fill:
          type: string
          enum: [none, previous, 'null']
          default: none
        limit: {type: integer, minimum: 1, maximum: 100000, default: 10000}
        cursor: {type: string}
    HistoryPoint:
      type: object
      required: [ts, quality]
      properties:
        ts: {$ref: '#/components/schemas/Timestamp'}
        ts_src: {$ref: '#/components/schemas/Timestamp'}
        value: {$ref: '#/components/schemas/Value'}
        seq: {type: [integer, string]}
        avg: {type: ['number', 'null']}
        min: {$ref: '#/components/schemas/Value'}
        max: {$ref: '#/components/schemas/Value'}
        first: {$ref: '#/components/schemas/Value'}
        last: {$ref: '#/components/schemas/Value'}
        count: {type: integer}
        quality: {$ref: '#/components/schemas/QualityCode'}
        reason: {$ref: '#/components/schemas/QualityReason'}
    HistorySeries:
      type: object
      required: [path, type, points]
      properties:
        path: {$ref: '#/components/schemas/SignalPath'}
        type: {$ref: '#/components/schemas/SignalType'}
        unit: {type: string}
        points:
          type: array
          items: {$ref: '#/components/schemas/HistoryPoint'}
    HistoryResponse:
      type: object
      required: [generation, from, to, tier, series, next_cursor]
      properties:
        generation: {$ref: '#/components/schemas/GenerationRef'}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        step: {$ref: '#/components/schemas/Duration'}
        tier: {$ref: '#/components/schemas/Tier'}
        coverage:
          type: array
          items:
            type: object
            properties:
              path: {$ref: '#/components/schemas/SignalPath'}
              tier: {$ref: '#/components/schemas/Tier'}
              from: {$ref: '#/components/schemas/Timestamp'}
              to: {$ref: '#/components/schemas/Timestamp'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
        series:
          type: array
          items: {$ref: '#/components/schemas/HistorySeries'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    HistoryLine:
      description: One NDJSON line - one point with the path
      allOf:
        - $ref: '#/components/schemas/HistoryPoint'
      properties:
        path: {$ref: '#/components/schemas/SignalPath'}
    EventRecord:
      type: object
      required: [path, ts, seq, record]
      properties:
        path: {$ref: '#/components/schemas/SignalPath'}
        ts: {$ref: '#/components/schemas/Timestamp'}
        ts_src: {$ref: '#/components/schemas/Timestamp'}
        seq: {type: [integer, string]}
        record:
          description: event record (ref/00, §4.1 - object with the same keys as the CBOR)
          type: object
    # ---------------------------------------------------------------- outputs and writes
    WriteOutcome:
      description: 'ref/00, §4.4. {"outcome":"clamped_rate","applied":1.0}, {"outcome":"rejected","reason":"interlock"}, {"outcome":"overridden","level":"manual:3"}'
      type: object
      required: [outcome]
      properties:
        outcome: {$ref: '#/components/schemas/Outcome'}
        applied: {$ref: '#/components/schemas/Value'}
        reason: {$ref: '#/components/schemas/RejectReason'}
        level: {$ref: '#/components/schemas/Level'}
    WriterDecl:
      type: object
      required: [writer, level, kind]
      properties:
        writer:
          description: app:<name>, user:<id>, bridge:<name>, impl:<instance>, intent:<id>
          type: string
        level: {$ref: '#/components/schemas/Level'}
        kind: {$ref: '#/components/schemas/WriterKind'}
        lease: {$ref: '#/components/schemas/Duration'}
    Envelope:
      description: Declared envelope (document 01, §7; document 03, §6); quantities as literals, expressions as strings
      type: object
      properties:
        range:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: string}
        range_now:
          description: range evaluated on the last tick (expressions)
          type: array
          minItems: 2
          maxItems: 2
          items: {type: [number, 'null']}
        on_range:
          type: string
          enum: [clamp, reject, trip]
        rate: {type: string}
        deadband: {type: string}
        min_interval: {$ref: '#/components/schemas/Duration'}
        max_actuations: {type: string}
        actuations_used: {type: integer}
        safe: {type: [string, number, boolean]}
        safer:
          type: string
          enum: [lower, higher, equal]
        safe_ramp: {type: string}
        interlock: {type: string}
        on_interlock:
          type: string
          enum: [safe, hold]
        permit_uncertain: {type: boolean}
        requires_good:
          type: array
          items: {$ref: '#/components/schemas/SignalPath'}
        reads:
          description: the signals the envelope reads, its expressions' inputs and requires_good, in path order (ADR 0091); what jk why shows
          type: array
          items: {$ref: '#/components/schemas/SignalPath'}
        grace: {$ref: '#/components/schemas/Duration'}
        max_lease: {$ref: '#/components/schemas/Duration'}
        max_manual: {$ref: '#/components/schemas/Duration'}
        verify:
          type: object
          properties:
            readback: {$ref: '#/components/schemas/SignalPath'}
            tolerance: {type: string}
            within: {$ref: '#/components/schemas/Duration'}
        reset_when: {type: string}
        schedule_depth: {type: integer}
        timed: {type: boolean}
        on_late: {type: string}
        pulse: {$ref: '#/components/schemas/Duration'}
        atomic: {type: string}
    ArbiterLevel:
      type: object
      required: [level, writer, kind, active]
      properties:
        level: {$ref: '#/components/schemas/Level'}
        writer: {type: string}
        kind: {$ref: '#/components/schemas/WriterKind'}
        on_behalf_of: {type: string}
        value: {$ref: '#/components/schemas/Value'}
        lease_until: {$ref: '#/components/schemas/Timestamp'}
        remaining: {$ref: '#/components/schemas/Duration'}
        last_proposal: {$ref: '#/components/schemas/Timestamp'}
        active:
          description: lease not expired
          type: boolean
        reason:
          description: reason (manual writes and intents)
          type: string
    OutputState:
      type: object
      required: [path, unit, group, safe, effective, applied, active_level, levels, tripped]
      properties:
        path: {$ref: '#/components/schemas/SignalPath'}
        unit: {type: string}
        type: {$ref: '#/components/schemas/SignalType'}
        group: {type: string}
        safe: {type: [string, number, boolean]}
        effective:
          description: value of the highest-priority active level, or safe (A5, A6)
          $ref: '#/components/schemas/Value'
        applied:
          description: last value applied by the envelope
          $ref: '#/components/schemas/Value'
        active_level: {$ref: '#/components/schemas/LevelOrNone'}
        active_writer: {type: string}
        last_outcome: {$ref: '#/components/schemas/WriteOutcome'}
        last_commit: {$ref: '#/components/schemas/Timestamp'}
        levels:
          description: occupied levels, by priority
          type: array
          items: {$ref: '#/components/schemas/ArbiterLevel'}
        tripped: {type: boolean}
        trip: {$ref: '#/components/schemas/Trip'}
        force_safe:
          description: supervisor bit (read-only)
          type: boolean
        confirmed:
          description: state of the readback check, if declared
          type: ['boolean', 'null']
        envelope: {$ref: '#/components/schemas/Envelope'}
        writers:
          type: array
          items: {$ref: '#/components/schemas/WriterDecl'}
    ManualWriteRequest:
      type: object
      required: [value, ttl, reason]
      additionalProperties: false
      properties:
        value: {$ref: '#/components/schemas/ValueInput'}
        ttl:
          description: required (A10); 1 s ≤ ttl ≤ max_manual of the output
          $ref: '#/components/schemas/Duration'
        level:
          description: default manual:4
          $ref: '#/components/schemas/ManualLevel'
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        takeover:
          description: replaces another principal occupying the same level (J-E1105 without this)
          type: boolean
          default: false
        wait:
          type: boolean
          default: true
        wait_timeout:
          description: default 5s, maximum 30s
          $ref: '#/components/schemas/Duration'
        at:
          description: reserved for 1.1 (scheduled write, M6); J-E1017 in 1.0
          $ref: '#/components/schemas/Timestamp'
    WritePreview:
      type: object
      required: [output, generation, current, proposal, prediction, envelope]
      properties:
        output: {$ref: '#/components/schemas/SignalPath'}
        unit: {type: string}
        generation: {$ref: '#/components/schemas/GenerationRef'}
        current: {$ref: '#/components/schemas/OutputState'}
        proposal:
          type: object
          required: [level, value, ttl, lease_until]
          properties:
            level: {$ref: '#/components/schemas/ManualLevel'}
            value:
              description: value converted to the output unit
              $ref: '#/components/schemas/Value'
            ttl: {$ref: '#/components/schemas/Duration'}
            lease_until: {$ref: '#/components/schemas/Timestamp'}
            renews:
              description: the principal already occupies this level; the write renews it
              type: boolean
        conflict:
          description: another principal occupies the requested level
          type: ['null', object]
          properties:
            writer: {type: string}
            principal: {type: string}
            until: {$ref: '#/components/schemas/Timestamp'}
            reason: {type: string}
        prediction:
          type: object
          required: [wins, outcome]
          properties:
            wins:
              description: the requested level becomes the active one
              type: boolean
            outcome: {$ref: '#/components/schemas/WriteOutcome'}
            overrides:
              description: lower-priority active levels that stop being in control
              type: array
              items: {$ref: '#/components/schemas/Level'}
            first_applied: {$ref: '#/components/schemas/Value'}
            time_to_target:
              description: estimate with the declared rate; null if there is no rate or it is not reached
              type: ['null', string]
            inputs:
              description: samples used in the permissive, requires_good and range
              type: array
              items: {$ref: '#/components/schemas/Sample'}
            notes:
              type: array
              items: {type: string}
            evaluated_at: {$ref: '#/components/schemas/Timestamp'}
        envelope: {$ref: '#/components/schemas/Envelope'}
    WriteTicket:
      type: object
      required: [id, output, state]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        output: {$ref: '#/components/schemas/SignalPath'}
        kind:
          type: string
          enum: [write, release, takeover, method, intent]
        state:
          type: string
          enum: [queued, committed, failed]
        writer: {type: string}
        on_behalf_of: {type: string}
        level: {$ref: '#/components/schemas/Level'}
        value: {$ref: '#/components/schemas/Value'}
        ttl: {$ref: '#/components/schemas/Duration'}
        lease_until: {$ref: '#/components/schemas/Timestamp'}
        renewed: {type: boolean}
        outcome: {$ref: '#/components/schemas/WriteOutcome'}
        tick:
          type: object
          properties:
            group: {type: string}
            seq: {type: integer}
            ts: {$ref: '#/components/schemas/Timestamp'}
        decision: {$ref: '#/components/schemas/Ulid'}
        generation: {$ref: '#/components/schemas/GenerationRef'}
        error: {$ref: '#/components/schemas/Problem'}
    ReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        level:
          description: default - the level the principal holds on this output (if there is only one)
          $ref: '#/components/schemas/ManualLevel'
        force:
          description: releases a level held by another principal (recorded in the audit)
          type: boolean
          default: false
        reason:
          type: string
          maxLength: 1024
        wait: {type: boolean, default: true}
    ResetRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        wait: {type: boolean, default: true}
    BulkResetRequest:
      type: object
      required: [sel, reason]
      additionalProperties: false
      properties:
        sel:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/Selector'}
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    ResetResult:
      type: object
      required: [output, result]
      properties:
        output: {$ref: '#/components/schemas/SignalPath'}
        result:
          type: string
          enum: [cleared, retripped, queued, not_tripped, failed]
        error:
          description: only with result failed, in a bulk reset (ADR 0061)
          type: object
          required: [code, detail]
          properties:
            code: {type: string}
            detail: {type: string}
        trip: {$ref: '#/components/schemas/Trip'}
        decision: {$ref: '#/components/schemas/Ulid'}
    Trip:
      type: object
      required: [output, since, cause]
      properties:
        output: {$ref: '#/components/schemas/SignalPath'}
        since: {$ref: '#/components/schemas/Timestamp'}
        scope:
          type: string
          enum: [output, group]
        cause:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [range, alarm, group_overrun, runtime]
            alarm: {$ref: '#/components/schemas/AlarmId'}
            group: {type: string}
            value: {$ref: '#/components/schemas/Value'}
            writer: {type: string}
        reset_when: {type: string}
        reset_when_now:
          description: current value of the reset_when condition
          type: ['boolean', 'null']
        declared:
          description: false for a persisted trip of an output the running generation does not declare (ADR 0070)
          type: boolean
    ManualOverride:
      type: object
      required: [output, level, writer, principal, value, until, reason]
      properties:
        output: {$ref: '#/components/schemas/SignalPath'}
        level: {$ref: '#/components/schemas/ManualLevel'}
        writer: {type: string}
        principal: {type: string}
        value: {$ref: '#/components/schemas/Value'}
        reason: {type: string}
        ttl: {$ref: '#/components/schemas/Duration'}
        since: {$ref: '#/components/schemas/Timestamp'}
        until: {$ref: '#/components/schemas/Timestamp'}
        remaining: {$ref: '#/components/schemas/Duration'}
        effective:
          description: is the active level of the output
          type: boolean
        restored:
          description: >-
            restored on a startup without a synced clock, for the remaining TTL (16 A14); alarm
            joker.output.<output>.manual_restored until renewed or released
          type: boolean
        event:
          description: only in the items of the WebSocket manual topic
          type: string
          enum: [set, renewed, expiring, expired, released, taken_over, restored]
        last_outcome: {$ref: '#/components/schemas/WriteOutcome'}
    DecisionKind:
      type: string
      enum: [proposal, expiry, release, takeover, safe, trip, reset, method, intent, write_ack]
    Decision:
      type: object
      required: [id, ts, output, kind]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        ts: {$ref: '#/components/schemas/Timestamp'}
        tick:
          type: object
          properties:
            group: {type: string}
            seq: {type: integer}
        generation: {$ref: '#/components/schemas/GenerationRef'}
        output: {$ref: '#/components/schemas/SignalPath'}
        kind: {$ref: '#/components/schemas/DecisionKind'}
        writer: {$ref: '#/components/schemas/WriterDecl'}
        on_behalf_of: {type: string}
        proposed: {$ref: '#/components/schemas/Value'}
        outcome: {$ref: '#/components/schemas/WriteOutcome'}
        applied: {$ref: '#/components/schemas/Value'}
        active_level: {$ref: '#/components/schemas/LevelOrNone'}
        repeats:
          description: consecutive ticks with the same (applied, outcome, active_level) after this entry (01 §19); 0 while the entry is the current one
          type: integer
          minimum: 0
        last_ts:
          description: instant of the last tick with the same triple (01 §19)
          $ref: '#/components/schemas/Timestamp'
        inputs:
          description: causal set (M3) - what the writer read in that tick
          type: array
          items:
            type: object
            required: [path, seq, quality]
            properties:
              path: {$ref: '#/components/schemas/SignalPath'}
              seq: {type: [integer, string]}
              value: {$ref: '#/components/schemas/Value'}
              quality: {$ref: '#/components/schemas/QualityCode'}
              reason: {$ref: '#/components/schemas/QualityReason'}
        app:
          type: object
          properties:
            name: {type: string}
            version: {type: string}
            digest: {$ref: '#/components/schemas/Digest'}
        manual:
          type: object
          properties:
            reason: {type: string}
            ttl: {$ref: '#/components/schemas/Duration'}
            request_id: {$ref: '#/components/schemas/Ulid'}
            principal: {$ref: '#/components/schemas/Principal'}
        method:
          type: object
          properties:
            instance: {type: string}
            method: {type: string}
            args: {type: object}
        intent: {$ref: '#/components/schemas/Ulid'}
        ack:
          description: only with kind = write_ack - a write the equipment did not confirm (ref/06 §2.9, ADR 0065)
          type: object
          required: [device, write_seq, write_kind, status, code]
          properties:
            device: {type: string}
            write_seq: {type: integer, minimum: 0}
            write_kind:
              type: string
              enum: [set, keepalive, force_safe, relinquish, resync]
            status:
              type: string
              enum: [timeout, comm_failure, device_rejected, not_connected, unsupported, late, skipped]
            code:
              type: ['null', string]
              enum: [null, J0877, J0878]
        model_outputs:
          description: reserved for 1.1 (M22)
          type: ['null', array]
    # ---------------------------------------------------------------- alarms
    Alarm:
      type: object
      required: [id, source, severity, state, active]
      properties:
        id: {$ref: '#/components/schemas/AlarmId'}
        source:
          type: string
          enum: [manifest, app, runtime, instance]
        severity: {$ref: '#/components/schemas/Severity'}
        state: {$ref: '#/components/schemas/AlarmState'}
        active: {type: boolean}
        uncertain:
          description: condition evaluated with Uncertain inputs (document 16, §3.2)
          type: boolean
        suppressed:
          description: suppress_when true
          type: boolean
        shelved:
          type: ['null', object]
          properties:
            until: {$ref: '#/components/schemas/Timestamp'}
            by: {type: string}
            reason: {type: string}
        acked_by: {type: string}
        acked_at: {$ref: '#/components/schemas/Timestamp'}
        since: {$ref: '#/components/schemas/Timestamp'}
        message: {type: string}
        condition: {type: string}
        signals:
          type: object
          properties:
            state: {$ref: '#/components/schemas/SignalPath'}
            active: {$ref: '#/components/schemas/SignalPath'}
        trips:
          type: array
          items: {$ref: '#/components/schemas/SignalPath'}
        max_shelve: {$ref: '#/components/schemas/Duration'}
    AckRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1024
    ShelveRequest:
      type: object
      required: [ttl, reason]
      additionalProperties: false
      properties:
        ttl:
          description: required; ≤ the alarm's max_shelve (default 24h)
          $ref: '#/components/schemas/Duration'
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    AlarmEvent:
      type: object
      required: [seq, id, ts, kind]
      properties:
        seq: {type: integer}
        id: {$ref: '#/components/schemas/AlarmId'}
        ts: {$ref: '#/components/schemas/Timestamp'}
        kind:
          type: string
          enum: [transition, ack, shelve, unshelve, shelve_expired, suppress, unsuppress]
        from: {$ref: '#/components/schemas/AlarmState'}
        to: {$ref: '#/components/schemas/AlarmState'}
        severity: {$ref: '#/components/schemas/Severity'}
        by: {type: string}
        reason: {type: string}
        message: {type: string}
        uncertain: {type: boolean}
    # ---------------------------------------------------------------- intents
    Intent:
      type: object
      required: [id, writer, output, value, justification, ttl, created_at, expires_at, state]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        writer:
          description: app:<name> of the proposal-only writer
          type: string
        output: {$ref: '#/components/schemas/SignalPath'}
        value: {$ref: '#/components/schemas/Value'}
        unit: {type: string}
        justification: {type: string}
        ttl: {$ref: '#/components/schemas/Duration'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at:
          description: created_at + ttl; a pending intent not approved by then becomes expired
          $ref: '#/components/schemas/Timestamp'
        state:
          type: string
          enum: [pending, approved, rejected, expired]
        decided_by: {type: string}
        decided_at: {$ref: '#/components/schemas/Timestamp'}
        decision_reason: {type: string}
        write: {$ref: '#/components/schemas/WriteTicket'}
        preview: {$ref: '#/components/schemas/WritePreview'}
    ApproveIntentRequest:
      type: object
      additionalProperties: false
      properties:
        level:
          description: default manual:4
          $ref: '#/components/schemas/ManualLevel'
        ttl:
          description: may shorten, never lengthen, the intent's TTL
          $ref: '#/components/schemas/Duration'
        reason:
          type: string
          maxLength: 1024
        takeover: {type: boolean, default: false}
        wait: {type: boolean, default: true}
    RejectIntentRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    # ---------------------------------------------------------------- actions
    ActionDecl:
      type: object
      required: [target, action, role, timeout, long]
      properties:
        target: {$ref: '#/components/schemas/Name'}
        target_kind:
          type: string
          enum: [device, instance]
        action: {$ref: '#/components/schemas/Name'}
        args:
          description: schema of the arguments (name → type and unit)
          type: object
          additionalProperties:
            type: object
            properties:
              type: {type: string}
              unit: {type: string}
              optional: {type: boolean}
        result:
          type: object
        permit: {type: string}
        permit_now:
          type: ['boolean', 'null']
        role: {$ref: '#/components/schemas/Role'}
        timeout: {$ref: '#/components/schemas/Duration'}
        long: {type: boolean}
        dedup_window: {$ref: '#/components/schemas/Duration'}
    InvokeRequest:
      type: object
      additionalProperties: false
      properties:
        args:
          description: arguments by name (quantities accept literals)
          type: object
          default: {}
        timeout:
          description: may shorten, never lengthen, the configured timeout
          $ref: '#/components/schemas/Duration'
        reason:
          type: string
          maxLength: 1024
        wait: {type: boolean, default: true}
    InvocationState:
      type: string
      enum: [queued, running, succeeded, failed, cancelling, cancelled, timed_out]
    Invocation:
      type: object
      required: [id, target, action, key, state, created_at, principal]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        target: {$ref: '#/components/schemas/Name'}
        action: {$ref: '#/components/schemas/Name'}
        key: {$ref: '#/components/schemas/IdempotencyKey'}
        state: {$ref: '#/components/schemas/InvocationState'}
        long: {type: boolean}
        principal: {type: string}
        reason: {type: string}
        args: {type: object}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        finished_at: {$ref: '#/components/schemas/Timestamp'}
        progress:
          type: ['null', object]
          properties:
            fraction: {type: ['number', 'null'], minimum: 0, maximum: 1}
            message: {type: string}
            updated_at: {$ref: '#/components/schemas/Timestamp'}
        result:
          type: ['null', object]
        error:
          type: ['null', object]
          required: [kind, code]
          properties:
            kind:
              type: string
              enum: [denied, timeout, device, invalid, cancelled]
            code:
              description: J-E1406–J-E1409 or J-E1415; the counterpart of the app's code (ref/04 §7.1)
              type: string
            message: {type: string}
        replay:
          description: previous result returned by deduplication (dedup_window)
          type: boolean
    # ---------------------------------------------------------------- instances and classes
    ClassRef:
      type: string
      pattern: '^([a-z][a-z0-9_]*/)?[a-z][a-z0-9_.]*@[0-9]+$'
    InstanceOrigin:
      type: string
      enum: [implicit, composed, virtual]
    InstanceHealth:
      type: string
      enum: [ok, degraded, failed]
    Instance:
      type: object
      required: [name, class, origin, health]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        class: {$ref: '#/components/schemas/ClassRef'}
        resolved: {type: string}
        contract: {$ref: '#/components/schemas/Digest'}
        origin: {$ref: '#/components/schemas/InstanceOrigin'}
        source:
          description: device (implicit), manifest (composite) or app:<name> (virtual)
          type: string
        capabilities:
          type: array
          items: {type: string}
        health: {$ref: '#/components/schemas/InstanceHealth'}
        health_detail:
          type: array
          items:
            type: object
            properties:
              member: {type: string}
              quality: {$ref: '#/components/schemas/QualityCode'}
              reason: {$ref: '#/components/schemas/QualityReason'}
        implementation:
          type: ['null', object]
          properties:
            app: {type: string}
            state: {$ref: '#/components/schemas/AppState'}
        members:
          type: array
          items: {$ref: '#/components/schemas/InstanceMember'}
        member_of:
          description: compositions of which this instance is a member (document 16, P6)
          type: array
          items:
            type: object
            required: [instance, member]
            properties:
              instance: {$ref: '#/components/schemas/Name'}
              member: {$ref: '#/components/schemas/Name'}
        depth:
          description: depth of the class composition (document 17, §8; maximum 3)
          type: integer
          minimum: 1
          maximum: 3
        layers:
          description: latency of each virtual layer (explain)
          type: array
          items:
            type: object
            properties:
              from: {type: string}
              to: {type: string}
              latency: {type: string}
    InstanceMember:
      type: object
      required: [name, kind]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        kind:
          type: string
          enum: [in, out, param, event, action, method, query, member]
        type: {type: string}
        unit: {type: string}
        path: {$ref: '#/components/schemas/SignalPath'}
        mapped_to:
          description: path or description of the adapter (scale, edge, on_rise, const:, enum_map)
          type: string
        origin:
          type: object
          properties:
            kind:
              type: string
              enum: [profile, manifest, app, class]
            ref: {type: string}
        sample: {$ref: '#/components/schemas/Sample'}
        signature:
          description: methods and actions - arguments and return
          type: string
        class:
          description: kind member - the class of the class member
          $ref: '#/components/schemas/ClassRef'
        bounds:
          description: kind member in a collection - [min, max]
          type: array
          items: {type: integer, minimum: 0}
          minItems: 2
          maxItems: 2
        elements:
          description: kind member - the bound instance (one element) or those of the collection, in collection order, each with its members
          type: array
          items: {$ref: '#/components/schemas/InstanceNode'}
    InstanceNode:
      description: a node of the class-member tree of a composite instance (ref/09 §5.11)
      type: object
      required: [path, class, health]
      properties:
        instance:
          description: name of the bound instance; null in an unnamed submember (profile, ref/03 §2.2.14)
          oneOf:
            - {$ref: '#/components/schemas/Name'}
            - {type: 'null'}
        path:
          description: nested path of this node (esp_io.boot, station.pumps.p1)
          type: string
        class: {$ref: '#/components/schemas/ClassRef'}
        origin: {$ref: '#/components/schemas/InstanceOrigin'}
        capabilities:
          type: array
          items: {type: string}
        health: {$ref: '#/components/schemas/InstanceHealth'}
        members:
          type: array
          items: {$ref: '#/components/schemas/InstanceMember'}
    MethodCallRequest:
      type: object
      required: [ttl, reason]
      additionalProperties: false
      properties:
        args:
          type: object
          default: {}
        ttl: {$ref: '#/components/schemas/Duration'}
        level: {$ref: '#/components/schemas/ManualLevel'}
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        takeover: {type: boolean, default: false}
        wait: {type: boolean, default: true}
        wait_timeout: {$ref: '#/components/schemas/Duration'}
    MethodPreview:
      type: object
      required: [instance, method, expansion]
      properties:
        instance: {$ref: '#/components/schemas/Name'}
        method: {$ref: '#/components/schemas/Name'}
        generation: {$ref: '#/components/schemas/GenerationRef'}
        atomic: {type: boolean}
        expansion:
          type: array
          items: {$ref: '#/components/schemas/WritePreview'}
    MethodCallResult:
      type: object
      required: [id, instance, method, writes]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        instance: {$ref: '#/components/schemas/Name'}
        method: {$ref: '#/components/schemas/Name'}
        writes:
          type: array
          items: {$ref: '#/components/schemas/WriteTicket'}
    VerifyRequest:
      type: object
      required: [conformance]
      additionalProperties: false
      properties:
        conformance:
          $ref: '#/components/schemas/ContentRef'
        cases:
          description: case ids; default - all
          type: array
          items: {type: string}
        level:
          description: manual level used by the harness on a real instance (default manual:3; the TTL is the suite's duration, ref/03 §2.6.3)
          $ref: '#/components/schemas/ManualLevel'
        allow_actuation:
          description: required (true) on a non-simulated instance - J0640 without it; with a safety or manual level active on the instance's outputs, J0641 (409)
          type: boolean
          default: false
        max_duration: {$ref: '#/components/schemas/Duration'}
        allow_prod:
          description: required in mode = prod; the harness writes to the equipment
          type: boolean
          default: false
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    ClassSummary:
      type: object
      required: [class, resolved, contract]
      properties:
        class: {$ref: '#/components/schemas/ClassRef'}
        resolved: {type: string}
        contract: {$ref: '#/components/schemas/Digest'}
        instances:
          type: array
          items: {$ref: '#/components/schemas/Name'}
    ClassContract:
      description: canonical form contract.json (document 17, §6.1; layout in ADR 0059)
      type: object
    # ---------------------------------------------------------------- devices and lock
    LinkState:
      description: link_state (ref/00 §6); drift and stopped belong to the core
      type: string
      enum: [connecting, up, degraded, down, drift, stopped]
    Device:
      type: object
      required: [name, driver, link]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        driver: {type: string}
        driver_version: {type: string}
        driver_descriptor: {$ref: '#/components/schemas/Digest'}
        tier:
          type: string
          enum: [n, w, x]
        bus: {type: string}
        address:
          description: address without credentials
          type: string
        profile: {type: string}
        link: {$ref: '#/components/schemas/LinkState'}
        since: {$ref: '#/components/schemas/Timestamp'}
        latency: {$ref: '#/components/schemas/Percentiles'}
        timeouts: {type: integer}
        reconnects: {type: integer}
        drift:
          type: array
          items: {$ref: '#/components/schemas/DriftEntry'}
        facts: {$ref: '#/components/schemas/DeviceFacts'}
        actions:
          type: array
          items: {$ref: '#/components/schemas/Name'}
        stopped_by:
          description: who stopped the driver with POST /v1/devices/{device}/stop (link = stopped); null if it was not stopped by hand
          type: ['null', object]
          properties:
            principal: {type: string}
            at: {$ref: '#/components/schemas/Timestamp'}
            reason: {type: string}
    DeviceFacts:
      type: object
      properties:
        discovered:
          type: ['null', object]
          properties:
            at: {$ref: '#/components/schemas/Timestamp'}
            firmware: {type: string}
            serial: {type: string}
            models:
              type: array
              items: {type: object}
            digest: {$ref: '#/components/schemas/Digest'}
        fallback:
          type: ['null', object]
          properties:
            register: {type: string}
            timeout: {$ref: '#/components/schemas/Duration'}
            value: {type: string}
            verified: {$ref: '#/components/schemas/Timestamp'}
            coherent: {type: boolean}
    LockFacts:
      type: object
      required: [generation, devices]
      properties:
        generation: {$ref: '#/components/schemas/GenerationRef'}
        runtime: {type: string}
        board: {type: string}
        devices:
          type: object
          additionalProperties: {$ref: '#/components/schemas/DeviceFacts'}
        restart_time:
          description: measured jokerd restart time (document 01, §8)
          $ref: '#/components/schemas/Duration'
        lock_toml:
          description: TOML excerpt with the [discovered.*] and [fallback.*] sections
          type: string
    DriftEntry:
      type: object
      required: [device, key, code]
      properties:
        device: {$ref: '#/components/schemas/Name'}
        key: {type: string}
        lock: {type: string}
        actual: {type: string}
        code: {type: string, examples: [J0401]}
        outputs_blocked: {type: boolean}
    ProbeRequest:
      description: >-
        Facts for the lock of devices the node does not yet have in a generation (ref/02 §3.1.3). Reads only:
        never switches on outputs nor writes to the equipment.
      type: object
      additionalProperties: false
      properties:
        manifest: {$ref: '#/components/schemas/ContentRef'}
        lock: {$ref: '#/components/schemas/ContentRef'}
        devices:
          description: with manifest, the devices to collect (default - all)
          type: array
          items: {$ref: '#/components/schemas/Name'}
        sections:
          description: >-
            without manifest, the [devices.<d>] sections in JSON (with the [buses.*] they use), by device name
          type: object
          additionalProperties: {type: object}
        what:
          description: what to collect (default - everything that applies to each device)
          type: array
          items:
            type: string
            enum: [discover, fallback, hello]
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/ArtifactRef'}
      anyOf:
        - required: [manifest]
        - required: [sections]
    # ---------------------------------------------------------------- apps
    AppState:
      type: string
      description: app_state (ref/00 §6); numeric values starting 0 .. updating 6, in this order
      enum: [starting, running, crashloop, stopped, failed, shadow, updating]
    App:
      type: object
      required: [name, state]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        version: {type: string}
        digest: {$ref: '#/components/schemas/Digest'}
        wit: {type: string}
        sdk: {type: string}
        state: {$ref: '#/components/schemas/AppState'}
        stopped_by:
          type: ['null', object]
          properties:
            principal: {type: string}
            at: {$ref: '#/components/schemas/Timestamp'}
            reason: {type: string}
        instances:
          type: object
          properties:
            cycle: {$ref: '#/components/schemas/AppInstance'}
            async: {$ref: '#/components/schemas/AppInstance'}
        writer: {$ref: '#/components/schemas/WriterDecl'}
        traps:
          type: object
          properties:
            count: {type: integer}
            last_at: {$ref: '#/components/schemas/Timestamp'}
            last_message: {type: string}
        restarts: {type: integer}
        crashloop:
          type: ['null', object]
          properties:
            backoff: {$ref: '#/components/schemas/Duration'}
            next_attempt: {$ref: '#/components/schemas/Timestamp'}
        shadow:
          type: ['null', object]
          properties:
            role:
              type: string
              enum: [candidate, primary]
            of: {type: string}
        implements:
          type: array
          items: {$ref: '#/components/schemas/Name'}
        meta:
          description: joker:meta metadata (ports, tasks, alarms, equipment) in JSON
          type: object
    AppInstance:
      type: object
      properties:
        state:
          type: string
          enum: [absent, running, trapped, stopped]
        group: {type: string}
        memory: {type: string}
        memory_max: {type: string}
        tasks:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              kind:
                type: string
                enum: [cycle, every, on, on_event, action]
              period: {$ref: '#/components/schemas/Duration'}
              wcet_declared: {$ref: '#/components/schemas/Duration'}
              wcet_measured_p999: {$ref: '#/components/schemas/Duration'}
              overruns: {type: integer}
              runs: {type: integer}
    KvListing:
      type: object
      required: [items, next_cursor]
      properties:
        used: {type: string}
        max: {type: string}
        items:
          type: array
          items:
            type: object
            required: [key, size]
            properties:
              key: {type: string}
              size: {type: integer}
              value:
                description: base64; only with key=
                type: string
                contentEncoding: base64
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    # ---------------------------------------------------------------- shadows
    Shadow:
      type: object
      required: [target, candidate, state]
      properties:
        target:
          description: app:<name> (model:<name> in 1.1)
          type: string
        candidate:
          type: object
          properties:
            version: {type: string}
            digest: {$ref: '#/components/schemas/Digest'}
        of: {type: string}
        state:
          type: string
          enum: [running, criteria_met, promoted, partially_promoted, aborted, expired]
        started_at: {$ref: '#/components/schemas/Timestamp'}
        until:
          type: object
          properties:
            duration: {$ref: '#/components/schemas/Duration'}
            max_divergence: {type: string}
            ends_at: {$ref: '#/components/schemas/Timestamp'}
        promoted_outputs:
          type: array
          items: {$ref: '#/components/schemas/Selector'}
        divergence:
          type: array
          items:
            type: object
            properties:
              output: {$ref: '#/components/schemas/SignalPath'}
              p50: {type: string}
              p95: {type: string}
              max: {type: string}
              samples: {type: integer}
        criteria:
          type: array
          items:
            type: object
            properties:
              expr: {type: string}
              met: {type: ['boolean', 'null']}
              value: {type: string}
        generation: {$ref: '#/components/schemas/GenerationRef'}
    ShadowStartRequest:
      type: object
      required: [target, candidate, reason]
      additionalProperties: false
      properties:
        target:
          type: string
          pattern: '^app:[a-z][a-z0-9_]{0,31}$'
        candidate:
          $ref: '#/components/schemas/ArtifactRef'
        until:
          type: object
          additionalProperties: false
          properties:
            duration: {$ref: '#/components/schemas/Duration'}
            max_divergence: {type: string}
        promote:
          description: automatic promotion when the criteria pass
          type: boolean
          default: false
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    ShadowPromoteRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        outputs:
          description: partial promotion (only these outputs); default - all
          type: array
          items: {$ref: '#/components/schemas/Selector'}
        force:
          description: promotes even without the criteria met
          type: boolean
          default: false
        confirm_window: {$ref: '#/components/schemas/Duration'}
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    ShadowDiff:
      type: object
      required: [target, series, next_cursor]
      properties:
        target: {type: string}
        series:
          type: array
          items:
            type: object
            properties:
              output: {$ref: '#/components/schemas/SignalPath'}
              unit: {type: string}
              points:
                type: array
                items:
                  type: object
                  properties:
                    ts: {$ref: '#/components/schemas/Timestamp'}
                    shadowed: {$ref: '#/components/schemas/Value'}
                    applied: {$ref: '#/components/schemas/Value'}
                    diff: {type: ['number', 'null']}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    # ---------------------------------------------------------------- blobs and generations
    ArtifactKind:
      description: >-
        Artifact types in the short form of the single table of ref/00 §7.1 (D13).
        joker.model.v1+jkm is reserved for 1.1 (J-E1017 in 1.0).
      type: string
      enum:
        - joker.config.v1+cbor
        - joker.manifest.v1+toml
        - joker.lock.v1+toml
        - joker.provenance.v1+json
        - joker.app.v1+wasm
        - joker.app.v1+cwasm
        - joker.driver.v1+wasm
        - joker.driver.v1+tar
        - joker.profile.v1+toml
        - joker.board.v1+toml
        - joker.sim.v1+toml
        - joker.class.v1+jkc
        - joker.class.contract.v1+json
        - joker.class.conformance.v1+toml
        - joker.micro-firmware.v1
        - joker.generation.v1
        - joker.secrets.v1
        - joker.key.v1+pem
        - joker.runtime.v1
        - joker.trace.v1
        - joker.model.v1+jkm
    UploadStart:
      type: object
      required: [digest, size, kind]
      additionalProperties: false
      properties:
        digest: {$ref: '#/components/schemas/Digest'}
        size: {type: integer, minimum: 1}
        kind: {$ref: '#/components/schemas/ArtifactKind'}
    Upload:
      type: object
      required: [id, digest, size, received, chunk_max, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        digest: {$ref: '#/components/schemas/Digest'}
        kind: {$ref: '#/components/schemas/ArtifactKind'}
        size: {type: integer}
        received:
          description: contiguous bytes received (next offset)
          type: integer
        chunk_max: {type: integer, examples: [8388608]}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    Blob:
      type: object
      required: [digest, size]
      properties:
        digest: {$ref: '#/components/schemas/Digest'}
        size: {type: integer}
        kind: {$ref: '#/components/schemas/ArtifactKind'}
        existed: {type: boolean}
    ContentRef:
      description: an already uploaded blob (digest) or inline content (text ≤ 1 MiB)
      type: object
      additionalProperties: false
      properties:
        digest: {$ref: '#/components/schemas/Digest'}
        content:
          type: string
          maxLength: 1048576
      oneOf:
        - required: [digest]
        - required: [content]
    ArtifactRef:
      type: object
      required: [digest, kind]
      additionalProperties: false
      properties:
        digest: {$ref: '#/components/schemas/Digest'}
        kind: {$ref: '#/components/schemas/ArtifactKind'}
        name:
          description: name by which the manifest refers to it (path, apps.<a>, profiles.<p>, keys/…)
          type: string
          maxLength: 512
        size: {type: integer}
        signature:
          description: COSE_Sign1 in base64, when the artifact does not carry its own signature
          type: string
    GenerationProposal:
      type: object
      required: [manifest, lock, artifacts]
      additionalProperties: false
      properties:
        manifest: {$ref: '#/components/schemas/ContentRef'}
        lock: {$ref: '#/components/schemas/ContentRef'}
        provenance: {$ref: '#/components/schemas/ContentRef'}
        artifacts:
          type: array
          maxItems: 1024
          items: {$ref: '#/components/schemas/ArtifactRef'}
        config:
          description: >-
            the joker.config.v1+cbor artifact: COSE_Sign1 of the config role whose payload is the generation descriptor
            (ref/10 §2.6.2); required in prod. The node rebuilds the descriptor and compares (J-E1607)
          $ref: '#/components/schemas/ContentRef'
        base:
          description: hash of the generation the plan is made against; null only in mode = dev
          oneOf:
            - $ref: '#/components/schemas/Digest'
            - type: 'null'
        message:
          type: string
          maxLength: 1024
        source:
          type: object
          additionalProperties: false
          properties:
            repo: {type: string}
            commit: {type: string}
            path: {type: string}
            dirty: {type: boolean}
    PlanChange:
      type: object
      required: [kind, target, effect]
      properties:
        kind:
          type: string
          enum: [driver_restart, driver_reconfigure, device_add, device_remove, app_add, app_remove, app_update,
                 app_params, envelope, signal_add, signal_remove, signal_retype, instance_add, instance_remove,
                 instance_change, alarm_add, alarm_remove, alarm_change, group_add, group_remove, group_change,
                 calc, uplink, bridge, telemetry, security, api, network, clock, resources, micro_generation,
                 micro_firmware, model, other]
        target: {type: string}
        effect:
          type: string
          enum: [none, hot, reload, restart]
        detail: {type: string}
        fields:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              from: {type: string}
              to: {type: string}
    Plan:
      type: object
      required: [base, target, requires_confirm, disruption, changes]
      properties:
        base: {$ref: '#/components/schemas/GenerationRef'}
        target: {$ref: '#/components/schemas/Digest'}
        requires_confirm: {type: boolean}
        confirm_reasons:
          type: array
          items:
            type: string
            enum: [network, security, uplinks, api]
        disruption:
          type: string
          enum: [none, hot, partial, full]
        changes:
          type: array
          items: {$ref: '#/components/schemas/PlanChange'}
        signal_ids:
          type: object
          properties:
            kept: {type: integer}
            added: {type: integer}
            removed: {type: integer}
            renumbered: {type: integer}
        admission:
          type: array
          items:
            type: object
            properties:
              cpu: {type: integer}
              utilization: {type: number}
              bound: {type: number}
              ok: {type: boolean}
        micros:
          type: array
          items:
            type: object
            properties:
              device: {type: string}
              kind:
                description: firmware carried by an activation (orchestrated MCU OTA) is reserved for 1.1 (ADR 0035); a 1.0 plan only lists generation
                type: string
                enum: [firmware, generation]
              digest: {$ref: '#/components/schemas/Digest'}
    Generation:
      type: object
      required: [gen, hash, state, created_at, created_by, origin]
      properties:
        gen:
          description: increasing integer per node (0 in dry_run responses)
          type: integer
          minimum: 0
        hash: {$ref: '#/components/schemas/Digest'}
        state: {$ref: '#/components/schemas/GenerationState'}
        origin:
          description: origin of the creation (that of the activations is in activations)
          $ref: '#/components/schemas/GenOrigin'
        derived_from: {$ref: '#/components/schemas/GenerationRef'}
        base: {$ref: '#/components/schemas/GenerationRef'}
        mode:
          type: string
          enum: [dev, prod]
        signed: {type: boolean}
        signer: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        created_by: {type: string}
        activated_at: {$ref: '#/components/schemas/Timestamp'}
        confirm_deadline: {$ref: '#/components/schemas/Timestamp'}
        confirmed_at: {$ref: '#/components/schemas/Timestamp'}
        confirmed_by: {type: string}
        ended_at: {$ref: '#/components/schemas/Timestamp'}
        message: {type: string}
        source:
          type: object
          properties:
            repo: {type: string}
            commit: {type: string}
            path: {type: string}
            dirty: {type: boolean}
        manifest: {$ref: '#/components/schemas/Digest'}
        lock: {$ref: '#/components/schemas/Digest'}
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/ArtifactRef'}
        plan: {$ref: '#/components/schemas/Plan'}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
        failure:
          description: with state = failed or rolled_back
          type: ['null', object]
          properties:
            reason:
              type: string
              enum: [validation, preparation, activation, health, window, rollback, rejected]
            code: {type: string}
            detail: {type: string}
        discard_reason:
          description: with state = discarded
          type: string
          enum: [deleted, superseded, expired]
        activations:
          description: the activations of this generation, from the most recent to the oldest (D9)
          type: array
          items: {$ref: '#/components/schemas/Activation'}
        retained:
          description: the blobs are still on the node (rollback possible)
          type: boolean
    GenOrigin:
      description: gen-origin (ref/10 §2.2)
      type: string
      enum: [local, session, agent, import, shadow, rollback, boot]
    Activation:
      type: object
      required: [at, origin]
      properties:
        at: {$ref: '#/components/schemas/Timestamp'}
        origin: {$ref: '#/components/schemas/GenOrigin'}
        by:
          description: principal (user:…, agent, jokerd)
          type: string
        from: {$ref: '#/components/schemas/GenerationRef'}
        reason: {type: string}
        desired_seq:
          description: seq of the desired state, with origin = agent
          type: integer
    ActivateRequest:
      type: object
      additionalProperties: false
      properties:
        confirm_window:
          description: 30s–24h; required in prod when plan.requires_confirm (ADR 0015)
          $ref: '#/components/schemas/Duration'
        reason:
          type: string
          maxLength: 1024
        wait: {type: boolean, default: true}
    RollbackRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        to:
          description: >-
            default - the last confirmed generation before the current one. Reactivates it with the same gen and the same hash (D9)
          $ref: '#/components/schemas/GenSelector'
        confirm_window: {$ref: '#/components/schemas/Duration'}
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    Provenance:
      type: object
      required: [generation, keys]
      properties:
        generation: {$ref: '#/components/schemas/GenerationRef'}
        keys:
          type: object
          additionalProperties:
            type: array
            description: from the oldest origin to the effective one
            items:
              type: object
              properties:
                file: {type: string}
                line: {type: integer}
                op:
                  type: string
                  enum: [set, append, unset, widen]
    # ---------------------------------------------------------------- runtime OTA
    RuntimeState:
      type: object
      required: [version, active_slot, slots]
      properties:
        version: {type: string}
        active_slot:
          type: string
          enum: [a, b]
        boot_id: {$ref: '#/components/schemas/Ulid'}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        slots:
          type: array
          items:
            type: object
            properties:
              slot:
                type: string
                enum: [a, b]
              version: {type: string}
              digest: {$ref: '#/components/schemas/Digest'}
              installed_at: {$ref: '#/components/schemas/Timestamp'}
              healthy: {type: ['boolean', 'null']}
        upgrade:
          type: ['null', object]
          properties:
            job: {$ref: '#/components/schemas/Ulid'}
            version: {type: string}
            state:
              type: string
              enum: [installing, switching, health_check, committed, rolled_back, failed]
            health_window: {$ref: '#/components/schemas/Duration'}
            started_at: {$ref: '#/components/schemas/Timestamp'}
            detail: {type: string}
    RuntimeUpgradeRequest:
      type: object
      required: [artifact, version, reason]
      additionalProperties: false
      properties:
        artifact:
          description: digest of an already uploaded joker.runtime.v1 blob
          $ref: '#/components/schemas/Digest'
        version: {type: string}
        signature: {type: string}
        health_window: {$ref: '#/components/schemas/Duration'}
        allow_downgrade: {type: boolean, default: false}
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    # ---------------------------------------------------------------- traces
    TraceRequest:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [record, ring, history, micro]
        duration:
          description: record - duration of the recording
          $ref: '#/components/schemas/Duration'
        groups:
          description: record, ring - groups (default - all; ring requires one)
          type: array
          items: {$ref: '#/components/schemas/Name'}
        async:
          description: record - also records the async reads (trace.async)
          type: boolean
          default: false
        last:
          description: ring - window up to now
          $ref: '#/components/schemas/Duration'
        from: {$ref: '#/components/schemas/TimeParam'}
        to: {$ref: '#/components/schemas/TimeParam'}
        app:
          description: history - app whose inputs are reconstructed
          $ref: '#/components/schemas/Name'
        device:
          description: micro - joker-link device
          $ref: '#/components/schemas/Name'
        label:
          type: string
          maxLength: 256
    Trace:
      type: object
      required: [id, source, state, created_at, created_by]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        source:
          type: string
          enum: [record, ring, history, micro]
        state:
          type: string
          enum: [recording, building, ready, stopped, failed]
        groups:
          type: array
          items: {type: string}
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        ends_at: {$ref: '#/components/schemas/Timestamp'}
        size_bytes: {type: integer}
        approximate:
          description: reconstructed from the historian - not exact at the group's rate
          type: boolean
        generations:
          type: array
          items: {$ref: '#/components/schemas/GenerationRef'}
        registry: {$ref: '#/components/schemas/Digest'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Diagnostic'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        created_by: {type: string}
        label: {type: string}
        file:
          description: download path (/v1/traces/<id>/file)
          type: string
    # ---------------------------------------------------------------- jobs and diagnostics
    JobKind:
      type: string
      enum: [doctor, discovery, profile_test, bench, lock_probe, class_verify, runtime_upgrade, runtime_rollback, micro_ota, generation_prepare]
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelling, cancelled]
    Job:
      type: object
      required: [id, kind, state, created_at, created_by]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        kind: {$ref: '#/components/schemas/JobKind'}
        state: {$ref: '#/components/schemas/JobState'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        created_by: {type: string}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        finished_at: {$ref: '#/components/schemas/Timestamp'}
        progress:
          type: ['null', object]
          properties:
            fraction: {type: ['number', 'null'], minimum: 0, maximum: 1}
            message: {type: string}
        result:
          description: DoctorReport, DiscoveryResult, ProfileTestResult, BenchResult, LockFacts, VerifyResult, RuntimeState or Micro, depending on kind
          type: ['null', object]
        error: {$ref: '#/components/schemas/Problem'}
    DoctorRequest:
      type: object
      additionalProperties: false
      properties:
        checks:
          description: base is always included
          type: array
          items:
            type: string
            enum: [base, rt, ml, network]
        rt_duration:
          description: default 60s
          $ref: '#/components/schemas/Duration'
        allow_live:
          description: allows --rt with active outputs in prod (hwlatdetect and cyclictest disturb rt)
          type: boolean
          default: false
    DoctorReport:
      type: object
      required: [id, started_at, summary, checks]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        finished_at: {$ref: '#/components/schemas/Timestamp'}
        summary:
          type: string
          enum: [ok, warn, fail]
        checks:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id:
                type: string
                examples: [kernel.preempt_rt, cpu.isolcpus, cpu.governor, irq.affinity, watchdog, clock, disk, permissions, groups, accelerators, device_fallbacks, restart_time, rt.major_faults, rt.hwlat, rt.cyclictest, files.drift, fieldbus.concurrent_clients]
              status:
                type: string
                enum: [ok, warn, fail, skip]
              detail: {type: string}
              code: {type: string}
              help: {type: string}
              measured:
                type: object
    DiscoveryRequest:
      type: object
      required: [uri]
      additionalProperties: false
      properties:
        uri:
          description: modbus-tcp://…, sunspec://…, opcua://…, can0, …
          type: string
          maxLength: 512
        unit:
          description: range of Modbus unit ids (1..10)
          type: string
          pattern: '^[0-9]{1,3}(\.\.[0-9]{1,3})?$'
        rate:
          description: requests per second (default 10/s)
          type: string
        timeout: {$ref: '#/components/schemas/Duration'}
    DiscoveryResult:
      description: result of a discovery job (ADR 0095)
      type: object
      required: [uri, hits, misses]
      properties:
        uri: {type: string}
        hits:
          type: array
          items:
            type: object
            required: [address, unit, identity, base, models, digest, profile_name, profile, lock]
            properties:
              address: {type: string, examples: ['192.168.10.30:502']}
              unit: {type: integer, minimum: 0, maximum: 255}
              identity:
                type: object
                properties:
                  vendor: {type: string}
                  model: {type: string}
                  serial: {type: string}
                  firmware: {type: string}
              base: {type: integer, minimum: 0, maximum: 65535, description: address of the SunS marker}
              models:
                type: array
                items:
                  type: object
                  required: [id, at, len, known, accepted]
                  properties:
                    id: {type: integer, minimum: 0, maximum: 65535}
                    at: {type: integer, minimum: 0, maximum: 65535}
                    len: {type: integer, minimum: 0, maximum: 65535}
                    known: {type: boolean, description: the runtime has the model definition}
                    accepted: {type: boolean}
              digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$', description: digest of the effective map (ADR 0077)}
              profile_name: {type: string, examples: ['acme/pcs-125@1']}
              profile: {type: string, description: suggested profile, TOML}
              lock: {type: string, description: 'the [discovered.<device>] entry, TOML'}
        misses:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              unit: {type: ['integer', 'null']}
              code: {type: string, examples: [J0876]}
              message: {type: string}
    ProfileTestRequest:
      type: object
      required: [profile, uri]
      additionalProperties: false
      properties:
        profile: {$ref: '#/components/schemas/ContentRef'}
        uri:
          description: >-
            Equipment URI (ref/03 §2.2.20), e.g. modbus-rtu:/dev/serial/by-id/…?baud=115200&unit=1
            or modbus-tcp://192.168.1.50:502?unit=1; invalid - J-E1708
          type: string
          maxLength: 512
        unit:
          description: equivalent to the URI's ?unit=; both, if different, J-E1708
          type: integer
          minimum: 0
          maximum: 255
        timeout: {$ref: '#/components/schemas/Duration'}
    BenchRequest:
      type: object
      required: [manifest, apps]
      additionalProperties: false
      properties:
        manifest: {$ref: '#/components/schemas/ContentRef'}
        apps:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ArtifactRef'}
        tasks:
          description: app.task; default - all cycle tasks
          type: array
          items: {type: string}
        iterations: {type: integer, minimum: 100, maximum: 1000000, default: 10000}
        allow_live: {type: boolean, default: false}
    # ---------------------------------------------------------------- uplinks, bridges, micros
    Uplink:
      type: object
      required: [name, kind, state]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        kind:
          description: otlp and http are reserved for 1.1 and zenoh for 1.2 (ADR 0035); a 1.0 node only reports mqtt and mqtt-sparkplug
          type: string
          enum: [mqtt, mqtt-sparkplug, zenoh, otlp, http]
        state:
          type: string
          enum: [connected, connecting, down, disabled]
        endpoint:
          description: without credentials
          type: string
        cursor_lag: {$ref: '#/components/schemas/Duration'}
        backlog_bytes: {type: integer}
        budget:
          description: uplink budgets (M12) are reserved for 1.1 (ADR 0035); always null on a 1.0 node
          type: ['null', object]
          properties:
            limit: {type: string}
            used: {type: string}
            projection: {type: string}
            degraded_classes:
              type: array
              items: {type: string}
        losses:
          type: object
          properties:
            dropped: {type: integer}
            by_policy: {type: object}
        last_error: {type: string}
        since: {$ref: '#/components/schemas/Timestamp'}
    Bridge:
      type: object
      required: [name, kind, state]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        kind: {type: string}
        state:
          type: string
          enum: [up, down, degraded]
        listen: {type: string}
        clients: {type: integer}
        writer: {$ref: '#/components/schemas/WriterDecl'}
        writable:
          type: array
          items: {$ref: '#/components/schemas/Selector'}
        writes:
          type: object
          properties:
            accepted: {type: integer}
            rejected: {type: integer}
            replay_rejected: {type: integer}
    Micro:
      type: object
      required: [device, transport, state]
      properties:
        device: {$ref: '#/components/schemas/Name'}
        transport:
          type: string
          enum: [uart, rs485, can, usb, udp, tcp]
        state:
          description: link_state (ref/00 §6)
          $ref: '#/components/schemas/LinkState'
        session_mode:
          description: session_mode (ref/00 §6), with the reason (HELLO status and code) when it is not full
          type: string
          enum: [full, observe, maintenance, refused]
        session_reason: {type: string}
        link_version:
          description: negotiated version ("1.0")
          type: string
        auth: {type: boolean}
        board: {type: string}
        firmware:
          type: object
          properties:
            version: {type: string}
            slot:
              type: string
              enum: [a, b]
            digest: {$ref: '#/components/schemas/Digest'}
            descriptor:
              description: the firmware descriptor (firmware.jkfw, ref/08 §2.14) in JSON
              type: object
            descriptor_digest: {$ref: '#/components/schemas/Digest'}
            capabilities_hash: {$ref: '#/components/schemas/Digest'}
            security_version: {type: integer}
            trial:
              description: firmware on trial, awaiting confirmation
              type: boolean
        abi:
          type: object
          properties:
            major: {type: integer}
            minor: {type: integer}
        generation:
          type: object
          properties:
            gen_seq: {type: integer}
            hash:
              description: the blob's source_hash (generation hash, ref/10 §2.6.2)
              $ref: '#/components/schemas/Digest'
            state: {$ref: '#/components/schemas/GenerationState'}
            confirm_left:
              description: time left in the confirmation window, if confirming
              $ref: '#/components/schemas/Duration'
            delivery:
              type: string
              enum: [embedded, flash]
        registry: {$ref: '#/components/schemas/Digest'}
        catalog: {$ref: '#/components/schemas/Digest'}
        drivers:
          description: summary of the descriptors of the planned drivers (HELLO key 15)
          $ref: '#/components/schemas/Digest'
        params_changed:
          description: app parameters changed locally on the MCU (drift from Git)
          type: array
          items: {type: string}
        hello:
          description: the last HELLO (offer), decoded to JSON (ref/07 §6.4)
          type: object
        classes:
          type: array
          items: {type: string}
        clock: {$ref: '#/components/schemas/ClockQuality'}
        last_hello: {$ref: '#/components/schemas/Timestamp'}
        stats:
          type: object
          properties:
            rtt: {$ref: '#/components/schemas/Duration'}
            frames_rx: {type: integer}
            frames_tx: {type: integer}
            crc_errors: {type: integer}
            auth_errors: {type: integer}
            replay_drops: {type: integer}
            rx_errors: {type: integer}
            retransmits: {type: integer}
            resyncs: {type: integer}
        ota:
          type: ['null', object]
          properties:
            job: {$ref: '#/components/schemas/Ulid'}
            kind:
              type: string
              enum: [firmware, generation]
            state:
              type: string
              enum: [transferring, verifying, switching, health_check, committed, rolled_back, failed]
            fraction: {type: number}
    MicroOtaRequest:
      type: object
      required: [kind, artifact, reason]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [firmware, generation]
        artifact: {$ref: '#/components/schemas/Digest'}
        signature:
          description: >-
            COSE_Sign1 of the OTA manifest (ref/07 §9.1), in base64; for a generation it already comes in the blob trailer
          type: string
        confirm_window:
          description: confirmation window on the MCU (confirm_ms of activate; default 5m)
          $ref: '#/components/schemas/Duration'
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    # ---------------------------------------------------------------- sim
    SimState:
      type: object
      required: [devices, forced]
      properties:
        devices:
          type: array
          items:
            type: object
            properties:
              name: {$ref: '#/components/schemas/Name'}
              model: {type: string}
              panel:
                type: array
                items:
                  type: object
                  properties:
                    signal: {$ref: '#/components/schemas/SignalPath'}
                    widget:
                      type: string
                      enum: [lamp, button, switch, slider, value]
                    key: {type: string}
                    range:
                      type: array
                      items: {type: string}
        forced:
          type: array
          items:
            type: object
            properties:
              path: {$ref: '#/components/schemas/SignalPath'}
              value: {$ref: '#/components/schemas/Value'}
              until: {$ref: '#/components/schemas/Timestamp'}
              by: {type: string}
    SimInputRequest:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: {$ref: '#/components/schemas/ValueInput'}
        ttl:
          description: default - until released or until the next generation
          $ref: '#/components/schemas/Duration'
    # ---------------------------------------------------------------- streaming
    Topic:
      description: frames and blocks reserved for 1.1
      type: string
      enum: [signals, outputs, alarms, events, decisions, logs, jobs, invocations, generations, intents,
             manual, status, metrics, signal_trace, audit, frames, blocks]
    WsSubscribe:
      type: object
      required: [op, id, topic]
      additionalProperties: false
      properties:
        op: {type: string, const: subscribe}
        id:
          description: id chosen by the client, returned in the responses
          type: string
          maxLength: 64
        topic: {$ref: '#/components/schemas/Topic'}
        sel:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Selector'}
        min_interval:
          description: state - default 100ms (signals), 1s (status, metrics); minimum 10ms
          $ref: '#/components/schemas/Duration'
        mode:
          description: change - only new samples (coalesced); interval - all of them every min_interval
          type: string
          enum: [change, interval]
          default: change
        initial:
          type: boolean
          default: true
        mono: {type: boolean, default: false}
        fields:
          description: sample fields to send (path and seq are always sent)
          type: array
          items: {type: string}
        buffer:
          description: events - queued items per subscription (64–4096, default 1024)
          type: integer
          minimum: 64
          maximum: 4096
          default: 1024
        severity: {$ref: '#/components/schemas/Severity'}
        states:
          type: array
          items: {$ref: '#/components/schemas/AlarmState'}
        outcome:
          type: array
          items: {$ref: '#/components/schemas/Outcome'}
        writer: {type: string}
        source: {type: string}
        app: {$ref: '#/components/schemas/Name'}
        level: {$ref: '#/components/schemas/LogLevel'}
        job: {$ref: '#/components/schemas/Ulid'}
        invocation: {$ref: '#/components/schemas/Ulid'}
        path:
          description: signal_trace - the signal to follow
          $ref: '#/components/schemas/SignalPath'
    WsUnsubscribe:
      type: object
      required: [op, sub]
      additionalProperties: false
      properties:
        op: {type: string, const: unsubscribe}
        id: {type: string, maxLength: 64}
        sub: {type: string}
    WsResume:
      type: object
      required: [op, session, subs]
      additionalProperties: false
      properties:
        op: {type: string, const: resume}
        id: {type: string, maxLength: 64}
        session: {$ref: '#/components/schemas/Ulid'}
        subs:
          type: array
          items:
            type: object
            required: [sub, last_seq]
            properties:
              sub: {type: string}
              last_seq: {type: integer, minimum: 0}
    WsPing:
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op: {type: string, const: ping}
        id: {type: string, maxLength: 64}
    WsList:
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op: {type: string, const: list}
        id: {type: string, maxLength: 64}
    WsClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WsSubscribe'
        - $ref: '#/components/schemas/WsUnsubscribe'
        - $ref: '#/components/schemas/WsResume'
        - $ref: '#/components/schemas/WsPing'
        - $ref: '#/components/schemas/WsList'
      discriminator:
        propertyName: op
        mapping:
          subscribe: '#/components/schemas/WsSubscribe'
          unsubscribe: '#/components/schemas/WsUnsubscribe'
          resume: '#/components/schemas/WsResume'
          ping: '#/components/schemas/WsPing'
          list: '#/components/schemas/WsList'
    WsServerMessage:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [welcome, subscribed, unsubscribed, resumed, data, resync, gap, resolved, heartbeat, pong, subscriptions, error, closing]
        id: {type: string}
        sub: {type: string}
        seq:
          description: data and resync - message counter per subscription, starting at 1
          type: integer
        topic: {$ref: '#/components/schemas/Topic'}
        items:
          description: samples (Sample), output states (OutputState), one Status or one Metrics (ADR 0063), or topic events
          type: array
          items: {type: object}
        session: {$ref: '#/components/schemas/Ulid'}
        boot_id: {$ref: '#/components/schemas/Ulid'}
        api: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        generation: {$ref: '#/components/schemas/GenerationRef'}
        heartbeat: {$ref: '#/components/schemas/Duration'}
        resume_window: {$ref: '#/components/schemas/Duration'}
        limits: {$ref: '#/components/schemas/Limits'}
        resolved: {type: integer}
        min_interval: {$ref: '#/components/schemas/Duration'}
        added:
          type: array
          items: {$ref: '#/components/schemas/SignalPath'}
        removed:
          type: array
          items: {$ref: '#/components/schemas/SignalPath'}
        lost:
          description: gap - lost items
          type: integer
        reason:
          type: string
          enum: [overflow, intake_overflow, resume_unavailable, generation, role_changed]
        skipped_ticks:
          description: signal_trace - ticks without changes or coalesced
          type: integer
        subs:
          description: resumed - one entry per requested subscription, in the order of the request (ADR 0074)
          type: array
          items:
            type: object
            required: [sub, result]
            properties:
              sub: {type: string}
              result:
                type: string
                enum: [replayed, resync, unknown]
        ts: {$ref: '#/components/schemas/Timestamp'}
        code:
          description: closing - WebSocket close code
          type: integer
        problem: {$ref: '#/components/schemas/Problem'}
    # ---------------------------------------------------------------- runtime drivers and agent
    RuntimeDriver:
      type: object
      required: [name, version, tier]
      properties:
        name: {type: string}
        version: {type: string}
        tier:
          type: string
          enum: [n, w, x]
        protocols:
          type: array
          items: {type: string}
        capabilities:
          type: array
          items: {type: string}
        descriptor: {$ref: '#/components/schemas/Digest'}
        source:
          description: builtin (tier N in the binary) or generation (tier W and X loaded by the generation)
          type: string
          enum: [builtin, generation]
    AgentState:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        authority:
          description: deck_id of the authority; absent without a Deck
          type: string
        transport:
          type: string
          enum: [https, mqtt, coap]
        connected: {type: boolean}
        last_contact: {$ref: '#/components/schemas/Timestamp'}
        proto_minor: {type: integer}
        desired_seq: {type: integer}
        report_seq: {type: integer}
        event_seq: {type: integer}
        queue:
          type: object
          properties:
            events: {type: integer}
            bytes: {type: integer}
            dropped: {type: integer}
            oldest: {$ref: '#/components/schemas/Timestamp'}
        paused_until: {$ref: '#/components/schemas/Timestamp'}
        hold:
          description: desired state on hold due to local changes (local_changes = hold)
          type: boolean
        sessions:
          type: integer
    AgentDesired:
      description: the decoded desired state (the JSON view of ref/10 §2.6.7) and the state of the apply
      type: object
      required: [desired, apply]
      properties:
        desired: {type: object}
        apply:
          type: object
          properties:
            state:
              type: string
              enum: [accepted, validating, fetching, staging, waiting, applying, confirming, confirmed,
                     rolled_back, failed, refused, superseded, noop]
            phase:
              type: string
              enum: [runtime, mcu, generation]
            wait:
              type: string
              enum: [not_before, window, jitter, clock, paused, local_hold, confirmation, rate_limit, mcu_link]
            code: {type: string}
            causes:
              type: array
              items: {type: string}
            fetched:
              type: array
              items: {type: integer}
    AgentPauseRequest:
      type: object
      required: [ttl, reason]
      additionalProperties: false
      properties:
        ttl:
          description: up to 7d
          $ref: '#/components/schemas/Duration'
        reason: {type: string, minLength: 1, maxLength: 1024}
    AgentImportRequest:
      type: object
      required: [desired]
      additionalProperties: false
      properties:
        desired:
          description: the desired state (COSE_Sign1) in base64
          type: string
          contentEncoding: base64
        artifacts:
          description: the digests of the artifacts already uploaded via /v1/blobs/uploads
          type: array
          items: {$ref: '#/components/schemas/Digest'}
    RemoteSession:
      type: object
      required: [id, principal, role, state]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        principal:
          description: deck:<deck_id>/user:<id>
          type: string
        role: {$ref: '#/components/schemas/Role'}
        state:
          type: string
          enum: [awaiting_consent, open, closed]
        reason: {type: string}
        opened_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        requests: {type: integer}
        writes: {type: integer}
    ReasonBody:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 1024}
    ReasonRequired:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 1024}
