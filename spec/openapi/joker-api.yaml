      operationId: manualWrite
      summary: Escrita manual com TTL obrigatório (A10); renova se o mesmo principal já ocupa o nível
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk write]
      x-joker-since: '1.0'
      parameters:
