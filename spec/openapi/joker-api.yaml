        default: {$ref: '#/components/responses/Problem'}
  /v1/stream:
    get:
      tags: [streaming]
      operationId: sse
      summary: Server-Sent Events - uma subscrição por pedido, com as mesmas mensagens JSON do WebSocket
      x-joker-role: viewer
      x-joker-cli: [curl, scripts]
      x-joker-since: '1.0'
      parameters:
        - name: topic
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Topic'}
        - name: sel
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 64
            items: {$ref: '#/components/schemas/Selector'}
        - name: min_interval
          in: query
          schema: {$ref: '#/components/schemas/Duration'}
        - name: initial
          in: query
          schema: {type: boolean, default: true}
        - $ref: '#/components/parameters/Mono'
