              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/history/query:
    post:
      tags: [history]
      operationId: queryHistory
