                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ActionDecl'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/actions/{target}/{action}:
    post:
      tags: [actions]
      operationId: invokeAction
      summary: Invoca uma ação de um dispositivo ou de uma instância (jk action). Idempotency-Key obrigatório.
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk action]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/ActionTarget'
        - $ref: '#/components/parameters/ActionName'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvokeRequest'}
