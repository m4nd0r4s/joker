          schema: {type: string, maxLength: 256}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KvListing'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ shadows (M16)
  /v1/shadows:
    get:
      tags: [shadows]
      operationId: listShadows
      x-joker-role: viewer
      x-joker-cli: [jk shadow status]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Shadow'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [shadows]
      operationId: startShadow
      summary: Põe um candidato em sombra, através de uma geração derivada da atual (jk shadow start)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk shadow start]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShadowStartRequest'}
      responses:
        '201':
          description: Geração derivada preparada e ativada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shadow'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/shadows/apps/{app}:
    get:
      tags: [shadows]
      operationId: getAppShadow
      x-joker-role: viewer
      x-joker-cli: [jk shadow status]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shadow'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/shadows/apps/{app}/diff:
    get:
      tags: [shadows]
      operationId: getAppShadowDiff
      summary: Divergência entre o que a sombra propôs e o que foi aplicado (jk shadow diff)
      x-joker-role: viewer
      x-joker-cli: [jk shadow diff]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - name: output
          in: query
          schema: {$ref: '#/components/schemas/Selector'}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Since'
        - name: step
          in: query
          schema: {$ref: '#/components/schemas/Duration'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShadowDiff'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/shadows/apps/{app}/promote:
    post:
      tags: [shadows]
      operationId: promoteAppShadow
      summary: Promove o candidato, total ou parcialmente por saídas (geração derivada)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk shadow promote]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShadowPromoteRequest'}
      responses:
        '200':
          description: Promovido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shadow'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/shadows/apps/{app}/abort:
    post:
      tags: [shadows]
      operationId: abortAppShadow
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk shadow abort]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequired'}
      responses:
        '200':
          description: Abortado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shadow'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ blobs
  /v1/blobs/missing:
    post:
      tags: [blobs]
      operationId: findMissingBlobs
      summary: Diz quais dos digests ainda não estão no armazém do nó
      x-joker-role: admin
      x-joker-cli: [jk apply, jk runtime upgrade, jk dev --node]
      x-joker-since: '1.0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digests]
              additionalProperties: false
              properties:
                digests:
                  type: array
                  minItems: 1
                  maxItems: 1024
                  items: {$ref: '#/components/schemas/Digest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [missing]
                properties:
                  missing:
                    type: array
                    items: {$ref: '#/components/schemas/Digest'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/blobs/{digest}:
    head:
      tags: [blobs]
      operationId: headBlob
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/BlobDigest'
      responses:
        '200': {description: Existe}
        '404': {description: Não existe}
    get:
      tags: [blobs]
      operationId: getBlob
      summary: Descarrega um blob do armazém (suporta Range)
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/BlobDigest'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '206': {description: Conteúdo parcial}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/blobs/uploads:
    post:
      tags: [blobs]
      operationId: startBlobUpload
      summary: Inicia um upload em blocos, ou faz um upload monolítico (≤ 8 MiB) com ?digest= e corpo
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk apply, jk runtime upgrade, jk dev --node]
      x-joker-since: '1.0'
      parameters:
        - name: digest
          in: query
          description: só no upload monolítico
          schema: {$ref: '#/components/schemas/Digest'}
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/ArtifactKind'}
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadStart'}
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '201':
          description: Upload monolítico concluído, ou blob já existente
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Blob'}
        '202':
          description: Sessão de upload criada
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/TooLarge'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/blobs/uploads/{upload}:
    get:
      tags: [blobs]
      operationId: getBlobUpload
      summary: Estado de um upload (para retomar)
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [blobs]
      operationId: uploadBlobChunk
      summary: Envia um bloco (≤ 8 MiB) com Content-Range; os blocos têm de ser contíguos
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: Content-Range
          in: header
          required: true
          schema: {type: string, pattern: '^bytes [0-9]+-[0-9]+/([0-9]+|\*)$'}
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '202':
          description: Bloco aceite
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [blobs]
      operationId: finishBlobUpload
      summary: Fecha o upload (com um último bloco opcional) e verifica o digest
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: digest
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Digest'}
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '201':
          description: Blob guardado
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Blob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [blobs]
      operationId: cancelBlobUpload
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      responses:
        '204': {description: Cancelado}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ generations
  /v1/generations:
    get:
      tags: [generations]
      operationId: listGenerations
      summary: Histórico de gerações (jk generations)
      x-joker-role: viewer
      x-joker-cli: [jk generations]
      x-joker-since: '1.0'
      parameters:
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/GenerationState'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Generation'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [generations]
      operationId: createGeneration
      summary: Valida e planeia (dry_run) ou prepara uma geração pendente (jk apply, jk check --node, jk dev --node)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk apply, jk apply --dry-run, jk check --node, jk dev --node]
      x-joker-since: '1.0'
      parameters:
        - name: dry_run
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationProposal'}
      responses:
        '200':
          description: dry_run - plano e diagnósticos, nada fica guardado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '201':
          description: Geração pendente preparada (AOT, registo, plano)
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/rollback:
    post:
      tags: [generations]
      operationId: rollbackGeneration
      summary: Volta a uma geração anterior guardada (jk rollback)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk rollback]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '200':
          description: Geração nova (origin rollback) ativa
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}:
    get:
      tags: [generations]
      operationId: getGeneration
      x-joker-role: viewer
      x-joker-cli: [jk generations, jk status]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
      responses:
        '200':
          description: OK
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [generations]
      operationId: discardGeneration
      summary: Descarta uma geração pendente não ativada
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      responses:
        '204': {description: Descartada}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/manifest:
    get:
      tags: [generations]
      operationId: getGenerationManifest
      summary: Manifesto efetivo da geração (jk diff --against)
      x-joker-role: viewer
      x-joker-cli: [jk diff]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
      responses:
        '200':
          description: OK
          content:
            application/toml:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/lock:
    get:
      tags: [generations]
      operationId: getGenerationLock
      x-joker-role: viewer
      x-joker-cli: [jk diff, jk lock --check --node]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
      responses:
        '200':
          description: OK
          content:
            application/toml:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/provenance:
    get:
      tags: [generations]
      operationId: getGenerationProvenance
      summary: Proveniência de cada chave do manifesto efetivo (overlay, ficheiro, linha), enviada pelo jk
      x-joker-role: viewer
      x-joker-cli: [jk explain <chave> --node, jk diff]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
        - name: key
          in: query
          description: chave em notação com pontos (outputs."pcs.p_set".range); sem ela, todas
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provenance'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/activate:
    post:
      tags: [generations]
      operationId: activateGeneration
      summary: Troca para a geração pendente, num limite de tick de cada grupo afetado (jk apply)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk apply, jk dev --node]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivateRequest'}
      responses:
        '200':
          description: Ativada (confirming ou confirmed), ou failed com a geração base reposta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '202':
          description: Troca em curso (wait=false)
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/confirm:
    post:
      tags: [generations]
      operationId: confirmGeneration
      summary: Confirma a geração em confirming (jk confirm)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk confirm]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: Confirmada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
