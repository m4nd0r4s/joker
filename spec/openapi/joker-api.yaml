      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk intent approve]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/IntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveIntentRequest'}
      responses:
        '200':
          description: Approved and applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intent'}
        '202':
          description: Approved; write in the owning group inbox
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/intents/{intent}/reject:
    post:
      tags: [intents]
      operationId: rejectIntent
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk intent reject]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/IntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RejectIntentRequest'}
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ actions (M19)
  /v1/actions:
    get:
      tags: [actions]
      operationId: listActions
      summary: Catalog of invocable actions (devices and instances)
      x-joker-role: viewer
      x-joker-cli: [jk action]
      x-joker-since: '1.0'
      parameters:
        - name: target
          in: query
          schema: {$ref: '#/components/schemas/Name'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ActionDecl'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/actions/{target}/{action}:
    post:
      tags: [actions]
      operationId: invokeAction
      summary: Invokes an action of a device or of an instance (jk action). Idempotency-Key required.
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk action]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/ActionTarget'
        - $ref: '#/components/parameters/ActionName'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvokeRequest'}
      responses:
        '200':
          description: Short action finished (succeeded or failed), or reinvocation within dedup_window
          headers:
            Joker-Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invocation'}
        '202':
          description: Long action, or a short one still running at the end of wait_timeout
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invocation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/invocations:
    get:
      tags: [actions]
      operationId: listInvocations
      x-joker-role: viewer
      x-joker-since: '1.0'
      parameters:
        - name: target
          in: query
          schema: {$ref: '#/components/schemas/Name'}
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/InvocationState'}
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Invocation'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/invocations/{invocation}:
    get:
      tags: [actions]
      operationId: getInvocation
      x-joker-role: viewer
      x-joker-cli: [jk action]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/InvocationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invocation'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/invocations/{invocation}/cancel:
    post:
      tags: [actions]
      operationId: cancelInvocation
      summary: Cancels a long action (ActionHandle)
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk action (Ctrl-C on a long action)]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/InvocationId'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: Cancellation requested or completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invocation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ instances and classes (M24)
  /v1/instances:
    get:
      tags: [instances]
      operationId: listInstances
      summary: Class instances, origin and health (jk status --instances)
      x-joker-role: viewer
      x-joker-cli: [jk status --instances]
      x-joker-since: '1.0'
      parameters:
        - name: class
          in: query
          schema: {$ref: '#/components/schemas/ClassRef'}
        - name: origin
          in: query
          schema: {$ref: '#/components/schemas/InstanceOrigin'}
        - name: health
          in: query
          schema: {$ref: '#/components/schemas/InstanceHealth'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Instance'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/instances/{instance}:
    get:
      tags: [instances]
      operationId: getInstance
      summary: Members, mapping, values, queries, health, class member tree and layers (jk explain <instance>)
      x-joker-role: viewer
      x-joker-cli: [jk explain <instance>, jk status --instances]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - name: values
          in: query
          schema: {type: boolean, default: true}
        - name: explain
          in: query
          description: adds the origin of each mapping and the latency of the virtual layers
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instance'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/instances/{instance}/methods/{method}/preview:
    post:
      tags: [instances]
      operationId: previewMethodCall
      summary: Predicted expansion of a method and predicted results in the envelope; does not write
      x-joker-role: viewer
      x-joker-cli: [jk call]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/MethodName'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MethodCallRequest'}
      responses:
        '200':
          description: OK
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MethodPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/instances/{instance}/methods/{method}:
    post:
      tags: [instances]
      operationId: callMethod
      summary: Calls a class method as a manual writer (document 17, §4.1) - jk call
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk call]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/MethodName'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MethodCallRequest'}
      responses:
        '200':
          description: Expanded and applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MethodCallResult'}
        '202':
          description: In the owning group's inbox
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MethodCallResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/instances/{instance}/verify:
    post:
      tags: [instances]
      operationId: verifyInstance
      summary: Runs the class conformance tests against a real instance (jk class verify --instance)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk class verify]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/InstanceName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/classes:
    get:
      tags: [instances]
      operationId: listClasses
      summary: Classes used by the running generation
      x-joker-role: viewer
      x-joker-cli: [jk class list --node]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ClassSummary'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/classes/{package}/{class}:
    get:
      tags: [instances]
      operationId: getClass
      summary: Canonical contract (contract.json, document 17, §6) of a class of the generation
      x-joker-role: viewer
      x-joker-cli: [jk class show --node]
      x-joker-since: '1.0'
      parameters:
        - name: package
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        - name: class
          in: path
          required: true
          description: name@major, for example pump@1
          schema: {type: string, pattern: '^[a-z][a-z0-9_.]*@[0-9]+$'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassContract'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ devices and lock facts
  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Devices, link state and drift
      x-joker-role: viewer
      x-joker-cli: [jk status, jk top]
      x-joker-since: '1.0'
      parameters:
        - name: link
          in: query
          schema: {$ref: '#/components/schemas/LinkState'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Device'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/devices/{device}:
    get:
      tags: [devices]
      operationId: getDevice
      x-joker-role: viewer
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/DeviceName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/devices/{device}/stop:
    post:
      tags: [devices]
      operationId: stopDevice
      summary: Stops the device driver (volatile until the next jokerd startup or the next generation); the link becomes stopped and the outputs take the device fallback
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk device stop]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequired'}
      responses:
        '200':
          description: State after the operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/devices/{device}/start:
    post:
      tags: [devices]
      operationId: startDevice
      summary: Starts the driver of a device stopped with stop again (connect, drift and resync as on a reconnection)
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk device start]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/DeviceName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: State after the operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/lock/facts:
    get:
      tags: [devices]
      operationId: getLockFacts
      summary: Facts of the running generation in the shape of joker.lock (discovered, firmware, fallbacks)
      x-joker-role: viewer
      x-joker-cli: [jk lock --node, jk lock --update]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LockFacts'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/lock/drift:
    get:
      tags: [devices]
      operationId: getLockDrift
      summary: Drift against joker.lock (J0401)
      x-joker-role: viewer
      x-joker-cli: [jk status, jk doctor]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DriftEntry'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/lock/probe:
    post:
      tags: [devices]
      operationId: probeLockFacts
      summary: Collects, with reads only, the device facts of a manifest not yet applied (jk lock --node)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk lock --node, jk lock --update]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProbeRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ apps
  /v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      x-joker-role: viewer
      x-joker-cli: [jk status]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/App'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/apps/{app}:
    get:
      tags: [apps]
      operationId: getApp
      x-joker-role: viewer
      x-joker-cli: [jk status, jk inspect --node]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/App'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/apps/{app}/start:
    post:
      tags: [apps]
      operationId: startApp
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk app start]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: State after the operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/App'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/apps/{app}/stop:
    post:
      tags: [apps]
      operationId: stopApp
      summary: Stops the app (volatile until the next jokerd startup or the next generation); the outputs follow the lease
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk app stop]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequired'}
      responses:
        '200':
          description: State after the operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/App'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/apps/{app}/restart:
    post:
      tags: [apps]
      operationId: restartApp
      summary: Recreates both instances of the app (also leaves crashloop)
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk app restart]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: State after the operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/App'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/apps/{app}/kv:
    get:
      tags: [apps]
      operationId: readAppKv
      summary: Reads the app kv (read-only; there is no write through the API)
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - name: key
          in: query
          description: exact key; without it, lists the keys
          schema: {type: string, maxLength: 256}
        - name: prefix
          in: query
          schema: {type: string, maxLength: 256}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KvListing'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ shadows (M16)
  /v1/shadows:
    get:
      tags: [shadows]
      operationId: listShadows
      summary: Reserved for 1.1; in 1.0 responds 501 J-E1017 (app shadow, M16; ADR 0035)
      x-joker-role: viewer
      x-joker-cli: [jk shadow status]
      x-joker-since: '1.1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Shadow'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [shadows]
      operationId: startShadow
      summary: Puts a candidate in shadow, through a generation derived from the current one (jk shadow start) - reserved for 1.1; in 1.0 responds 501 J-E1017 (app shadow, M16; ADR 0035)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk shadow start]
      x-joker-since: '1.1'
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShadowStartRequest'}
      responses:
        '201':
          description: Derived generation prepared and activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shadow'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/shadows/apps/{app}:
    get:
      tags: [shadows]
      operationId: getAppShadow
      summary: Reserved for 1.1; in 1.0 responds 501 J-E1017 (app shadow, M16; ADR 0035)
      x-joker-role: viewer
      x-joker-cli: [jk shadow status]
      x-joker-since: '1.1'
      parameters:
        - $ref: '#/components/parameters/AppName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shadow'}
        '404': {$ref: '#/components/responses/NotFound'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/shadows/apps/{app}/diff:
    get:
      tags: [shadows]
      operationId: getAppShadowDiff
      summary: Divergence between what the shadow proposed and what was applied (jk shadow diff) - reserved for 1.1; in 1.0 responds 501 J-E1017 (app shadow, M16; ADR 0035)
      x-joker-role: viewer
      x-joker-cli: [jk shadow diff]
      x-joker-since: '1.1'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - name: output
          in: query
          schema: {$ref: '#/components/schemas/Selector'}
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Since'
        - name: step
          in: query
          schema: {$ref: '#/components/schemas/Duration'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShadowDiff'}
        '404': {$ref: '#/components/responses/NotFound'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/shadows/apps/{app}/promote:
    post:
      tags: [shadows]
      operationId: promoteAppShadow
      summary: Promotes the candidate, fully or partially by outputs (derived generation) - reserved for 1.1; in 1.0 responds 501 J-E1017 (app shadow, M16; ADR 0035)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk shadow promote]
      x-joker-since: '1.1'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShadowPromoteRequest'}
      responses:
        '200':
          description: Promoted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shadow'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/shadows/apps/{app}/abort:
    post:
      tags: [shadows]
      operationId: abortAppShadow
      summary: Reserved for 1.1; in 1.0 responds 501 J-E1017 (app shadow, M16; ADR 0035)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk shadow abort]
      x-joker-since: '1.1'
      parameters:
        - $ref: '#/components/parameters/AppName'
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequired'}
      responses:
        '200':
          description: Aborted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shadow'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '501': {$ref: '#/components/responses/NotImplemented'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ blobs
  /v1/blobs/missing:
    post:
      tags: [blobs]
      operationId: findMissingBlobs
      summary: Says which of the digests are not yet in the node's store
      x-joker-role: admin
      x-joker-cli: [jk apply, jk runtime upgrade, jk dev --node]
      x-joker-since: '1.0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digests]
              additionalProperties: false
              properties:
                digests:
                  type: array
                  minItems: 1
                  maxItems: 1024
                  items: {$ref: '#/components/schemas/Digest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [missing]
                properties:
                  missing:
                    type: array
                    items: {$ref: '#/components/schemas/Digest'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/blobs/{digest}:
    head:
      tags: [blobs]
      operationId: headBlob
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/BlobDigest'
      responses:
        '200': {description: Exists}
        '404': {description: Does not exist}
    get:
      tags: [blobs]
      operationId: getBlob
      summary: Downloads a blob from the store (supports Range)
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/BlobDigest'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '206': {description: Partial content}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/blobs/uploads:
    post:
      tags: [blobs]
      operationId: startBlobUpload
      summary: Starts a chunked upload, or does a monolithic upload (≤ 8 MiB) with ?digest= and a body
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk apply, jk runtime upgrade, jk dev --node]
      x-joker-since: '1.0'
      parameters:
        - name: digest
          in: query
          description: only in the monolithic upload
          schema: {$ref: '#/components/schemas/Digest'}
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/ArtifactKind'}
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadStart'}
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '201':
          description: Monolithic upload completed, or blob already exists
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Blob'}
        '202':
          description: Upload session created
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '413': {$ref: '#/components/responses/TooLarge'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/blobs/uploads/{upload}:
    get:
      tags: [blobs]
      operationId: getBlobUpload
      summary: State of an upload (to resume it)
      x-joker-role: admin
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [blobs]
      operationId: uploadBlobChunk
      summary: Sends a chunk (≤ 8 MiB) with Content-Range; chunks must be contiguous
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: Content-Range
          in: header
          required: true
          schema: {type: string, pattern: '^bytes [0-9]+-[0-9]+/([0-9]+|\*)$'}
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '202':
          description: Chunk accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [blobs]
      operationId: finishBlobUpload
      summary: Closes the upload (with an optional last chunk) and verifies the digest
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: digest
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Digest'}
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '201':
          description: Blob stored
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Blob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [blobs]
      operationId: cancelBlobUpload
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      responses:
        '204': {description: Canceled}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ generations
  /v1/generations:
    get:
      tags: [generations]
      operationId: listGenerations
      summary: Generation history (jk generations)
      x-joker-role: viewer
      x-joker-cli: [jk generations]
      x-joker-since: '1.0'
      parameters:
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/GenerationState'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Generation'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [generations]
      operationId: createGeneration
      summary: Validates and plans (dry_run) or prepares a pending generation (jk apply, jk check --node, jk dev --node)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk apply, jk apply --dry-run, jk check --node, jk dev --node]
      x-joker-since: '1.0'
      parameters:
        - name: dry_run
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationProposal'}
      responses:
        '200':
          description: dry_run - plan and diagnostics, nothing is stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '201':
          description: Pending generation prepared (AOT, registry, plan)
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/rollback:
    post:
      tags: [generations]
      operationId: rollbackGeneration
      summary: Returns to a previous stored generation (jk rollback)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk rollback]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '200':
          description: New generation (origin rollback) active
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}:
    get:
      tags: [generations]
      operationId: getGeneration
      x-joker-role: viewer
      x-joker-cli: [jk generations, jk status]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
      responses:
        '200':
          description: OK
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [generations]
      operationId: discardGeneration
      summary: Discards a pending generation that was not activated
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      responses:
        '204': {description: Discarded}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/manifest:
    get:
      tags: [generations]
      operationId: getGenerationManifest
      summary: Effective manifest of the generation (jk diff --against)
      x-joker-role: viewer
      x-joker-cli: [jk diff]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
      responses:
        '200':
          description: OK
          content:
            application/toml:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/lock:
    get:
      tags: [generations]
      operationId: getGenerationLock
      x-joker-role: viewer
      x-joker-cli: [jk diff, jk lock --check --node]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
      responses:
        '200':
          description: OK
          content:
            application/toml:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/provenance:
    get:
      tags: [generations]
      operationId: getGenerationProvenance
      summary: Provenance of each key of the effective manifest (overlay, file, line), sent by jk
      x-joker-role: viewer
      x-joker-cli: [jk explain <key> --node, jk diff]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
        - name: key
          in: query
          description: key in dot notation (outputs."pcs.p_set".range); without it, all
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provenance'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/activate:
    post:
      tags: [generations]
      operationId: activateGeneration
      summary: Swaps to the pending generation, at a tick boundary of each affected group (jk apply)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk apply, jk dev --node]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
        - $ref: '#/components/parameters/IfMatchRequired'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivateRequest'}
      responses:
        '200':
          description: Activated (confirming or confirmed), or failed with the base generation restored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '202':
          description: Swap in progress (wait=false)
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/generations/{gen}/confirm:
    post:
      tags: [generations]
      operationId: confirmGeneration
      summary: Confirms the generation in confirming (jk confirm)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk confirm]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/GenRef'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonBody'}
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ runtime OTA
  /v1/runtime:
    get:
      tags: [runtime]
      operationId: getRuntime
      summary: Runtime A/B slots and state of the last update
      x-joker-role: viewer
      x-joker-cli: [jk runtime upgrade, jk status]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeState'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/runtime/upgrades:
    post:
      tags: [runtime]
      operationId: upgradeRuntime
      summary: Runtime OTA from a signed blob already uploaded (jk runtime upgrade)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-cli: [jk runtime upgrade]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuntimeUpgradeRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/runtime/drivers:
    get:
      tags: [runtime]
      operationId: listRuntimeDrivers
      summary: Driver manifest of the binary and tier W and X drivers loaded by the generation (ref/06 §3.8)
      x-joker-role: viewer
      x-joker-cli: [jk lock, jk status]
      x-joker-since: '1.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RuntimeDriver'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/runtime/rollback:
    post:
      tags: [runtime]
      operationId: rollbackRuntime
      summary: Returns to the other slot (restarts jokerd)
      x-joker-role: admin
      x-joker-mutating: true
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequired'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ traces
  /v1/traces:
    get:
      tags: [traces]
      operationId: listTraces
      x-joker-role: viewer
      x-joker-cli: [jk record, jk trace-dump, jk trace-from-history]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Trace'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [traces]
      operationId: createTrace
      summary: Records (record), extracts from the continuous ring (ring), rebuilds from the historian (history) or requests from an MCU (micro)
      x-joker-role: operator
      x-joker-mutating: true
      x-joker-cli: [jk record, jk trace-dump, jk trace-from-history]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JokerNonce'
        - $ref: '#/components/parameters/JokerTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TraceRequest'}
      responses:
        '201':
          description: Trace created (recording or building)
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Trace'}
