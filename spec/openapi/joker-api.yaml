      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualWriteRequest'}
      responses:
        '200':
          description: Aplicada no tick do grupo dono; o resultado do envelope vem no corpo (um rejected é uma resposta 200)
