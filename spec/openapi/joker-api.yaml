      x-joker-role: viewer
      x-joker-since: '1.0'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ValuesQuery'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValuesResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/values/refresh:
