              schema: {$ref: '#/components/schemas/EventRecord'}
        default: {$ref: '#/components/responses/Problem'}
  # ------------------------------------------------------------------ outputs, arbiter, trips, decisions
  /v1/outputs:
    get:
      tags: [outputs]
      operationId: listOutputs
      summary: Outputs with effective value, active level, last result and trip
      x-joker-role: viewer
      x-joker-cli: [jk status, jk top]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/Sel'
        - name: tripped
          in: query
          schema: {type: boolean}
        - name: manual
          in: query
          description: only outputs with an active manual level
          schema: {type: boolean}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/OutputState'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/outputs/{path}:
    get:
      tags: [outputs]
      operationId: getOutput
      summary: Full arbiter and envelope state of an output
      x-joker-role: viewer
      x-joker-cli: [jk write (before asking for confirmation), jk trace, jk explain <output>]
      x-joker-since: '1.0'
      parameters:
        - $ref: '#/components/parameters/SignalPath'
      responses:
        '200':
          description: OK
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
