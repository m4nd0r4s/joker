[workspace]
resolver = "3"
members = ["crates/*", "crates/joker-host/fixtures/*", "crates/joker-sdk/fixtures/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/m4nd0r4s/joker"
publish = false

[workspace.dependencies]
joker-units = { path = "crates/joker-units", default-features = false }
joker-expr = { path = "crates/joker-expr", default-features = false }
joker-core = { path = "crates/joker-core", default-features = false }
joker-sdk-sys = { path = "crates/joker-sdk-sys" }
portable-atomic = { version = "1.13", default-features = false, features = ["critical-section"] }
critical-section = { version = "1.2", default-features = false }
loom = "0.7"
wasmtime = { version = "=49.0.4", default-features = false, features = ["std", "runtime", "cranelift", "all-arch", "component-model", "component-model-async", "parallel-compilation"] }
wasmtime-wasi = { version = "=49.0.4", default-features = false, features = ["p2"] }
wasmparser = { version = "0.258.3", default-features = false, features = ["std", "validate", "component-model"] }
sha2 = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing", "proc-macro", "clone-impls"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
inventory = "0.3.24"
joker-sdk-macros = { path = "crates/joker-sdk-macros" }
joker = { package = "joker-sdk", path = "crates/joker-sdk" }
joker-host = { path = "crates/joker-host" }
wit-bindgen = { version = "=0.61.1", default-features = false, features = ["macros", "realloc", "async"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
