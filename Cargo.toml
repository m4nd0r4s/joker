[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["tools/bench/esp32-modbus"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/m4nd0r4s/joker"
publish = false

[workspace.dependencies]
joker-units = { path = "crates/joker-units", default-features = false }
joker-expr = { path = "crates/joker-expr", default-features = false }
joker-core = { path = "crates/joker-core", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
