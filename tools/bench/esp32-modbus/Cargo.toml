[workspace]
members = ["logic"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[package]
name = "esp32-modbus"
description = "RTU-only Modbus bench firmware for the original ESP32 (docs/23 §4)"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/m4nd0r4s/joker"
publish = false

[[bin]]
name = "esp32-modbus"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bench-esp32-logic = { path = "logic" }
esp-hal = { version = "=1.2.2", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32"] }

[lints]
workspace = true

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
