schema = 1

[suite]
kind  = "action"
id    = "actions.long"
spec  = ["docs/02 §8", "ref/03 §2.2.12", "ref/06 §2.10", "ref/09 §3.13", "ref/09 §5.10", "ADR 0058 §5", "ADR 0066"]
hosts = ["linux"]

[fixture]
manifest = """
[project]
name  = "actions-long"
joker = "1.0"
mode  = "dev"

[devices.pcs]
driver  = "modbus-tcp"
address = "127.0.0.1:1502"
unit_id = 1
profile = "acme/pcs@1"
poll    = "20ms"
timeout = "200ms"
"""

[fixture.profiles]
"acme/pcs@1" = """
[profile]
name    = "acme/pcs"
version = "1.0.0"
driver  = "modbus"

[signals.state]
at   = 30001
fc   = 4
type = "u16"

[actions.calibrate]
long    = true
timeout = "2s"
steps   = [
    { wait = "100ms" },
    { write = { at = 40400, fc = 6, type = "u16", value = 1 } },
    { wait = "100ms" },
    { write = { at = 40400, fc = 6, type = "u16", value = 2 } },
]

[actions.identify]
native  = { method = "identify" }
result  = { serial = "u64" }
timeout = "1s"

[actions.broken]
native  = { method = "broken" }
timeout = "1s"

[actions.firmware]
native  = { method = "update" }
long    = true
timeout = "5s"
"""

[[double]]
device    = "pcs"
registers = { "30001" = 0 }

[double.native.identify]
result = { serial = 1234 }

[double.native.broken]
failure = "device"

[double.native.firmware]
hold = "2s"

[[case]]
id     = "a_long_step_action_runs_to_the_end_and_reports_progress"
name   = "a long action is followed as an invocation and reports its progress by step"
spec   = ["ref/09 §3.13", "ref/09 §5.10", "ADR 0066 §6", "ADR 0066 §10"]
do     = [{ at = "100ms", invoke = "pcs.calibrate", key = "k1" }, { at = "100ms", settle = true }]
expect = [
    { invocation = "k1", state = "succeeded", progress = 1.0 },
    { writes = "pcs", equals = [[40400, 1], [40400, 2]] },
    { decision = "k1", outcome = "ok", count = 1 },
]

[[case]]
id     = "cancelling_a_long_step_action_stops_it_before_its_next_step"
name   = "a cancelled long step program ends cancelled before the next step"
spec   = ["docs/02 §8", "ref/09 §5.10", "ADR 0066 §9", "ADR 0066 §13"]
do     = [
    { at = "100ms", invoke = "pcs.calibrate", key = "k1" },
    { at = "150ms", cancel = "k1" },
]
expect = [
    { invocation = "k1", state = "cancelled", error = "cancelled", code = "J-E1409" },
    { writes = "pcs", equals = [] },
    { decision = "k1", outcome = "failed", kind = "cancelled", code = "J-E1409" },
]

[[case]]
id     = "a_native_action_returns_its_record"
doubles = ["register"]
name   = "a native action reaches the driver's invoke and its record is the result"
spec   = ["ref/06 §2.10", "ADR 0058 §5"]
do     = [{ at = "100ms", invoke = "pcs.identify", key = "k1" }]
expect = [
    { invocation = "k1", state = "succeeded", result = { serial = 1234 } },
    { writes = "pcs", equals = [] },
    { decision = "k1", outcome = "ok" },
]

[[case]]
id     = "a_native_failure_is_a_device_failure"
doubles = ["register"]
name   = "a native action-failure device is projected onto device"
spec   = ["ref/06 §2.10", "ref/04 §7.1", "ADR 0066 §13"]
do     = [{ at = "100ms", invoke = "pcs.broken", key = "k1" }]
expect = [
    { invocation = "k1", state = "failed", error = "device", code = "J-E1407" },
]

[[case]]
id     = "cancelling_a_long_native_action"
doubles = ["register"]
name   = "a long native action sees the cancellation and ends cancelled"
spec   = ["ref/06 §2.10", "ADR 0066 §9"]
do     = [
    { at = "100ms", invoke = "pcs.firmware", key = "k1" },
    { at = "300ms", cancel = "k1" },
]
expect = [
    { invocation = "k1", state = "cancelled", error = "cancelled", code = "J-E1409" },
]
