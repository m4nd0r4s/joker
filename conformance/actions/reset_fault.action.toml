schema = 1

[suite]
kind = "action"
id   = "actions.reset_fault"
spec = ["ref/06 §2.10", "ref/06 §2.14", "ADR 0058 §7", "ref/09 §5.10"]

[fixture]
joker_toml = """
[project]
name  = \"actions-conformance\"
joker = \"1.0\"
mode  = \"dev\"

[buses.line0]
kind = \"serial\"
port = \"/dev/ttyUSB0\"
baud = 9600

[devices.pcs]
driver  = \"modbus-rtu\"
bus     = \"line0\"
profile = \"acme/pcs@1\"
timeout = \"1s\"
unit_id = 1
"""

profile_toml = """
schema = 1

[profile]
name    = \"acme/pcs\"
version = \"1.0.0\"
driver  = \"modbus\"

[signals.p_ac]
at   = 0
fc   = 4
type = \"f32\"
unit = \"kW\"

[actions.reset_fault]
steps = [
    { write = { at = 40300, fc = 6, type = \"u16\", value = 1 } },
    { wait = \"10ms\" },
    { write = { at = 40300, fc = 6, type = \"u16\", value = 0 } },
]
"""

[[case]]
name    = "a declared action is admitted, runs, and is logged as succeeded"
spec    = ["ref/06 §2.10", "ADR 0058 §7", "AGENTS.md invariant 8"]
device  = "pcs"
action  = "reset_fault"
key     = "k1"
driver  = "succeeds"

[case.expect]
state         = "succeeded"
decision_kind = "action"
outcome       = "ok"

[[case]]
name    = "the same key within dedup_window replays, it does not run again"
spec    = ["ref/01 §5.8.2", "docs/16 E9"]
device  = "pcs"
action  = "reset_fault"
key     = "k1"
driver  = "succeeds"
after   = "a declared action is admitted, runs, and is logged as succeeded"

[case.expect]
state         = "succeeded"
decision_kind = "action"
outcome       = "ok"
replay        = true

[[case]]
name    = "a driver failure is reported and logged as failed"
spec    = ["ref/06 §2.10", "ADR 0058 §7"]
device  = "pcs"
action  = "reset_fault"
key     = "k2"
driver  = "fails"

[case.expect]
state         = "failed"
decision_kind = "action"
outcome       = "failed"
