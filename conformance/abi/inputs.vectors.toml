schema = 1

[vectors]
kind        = "abi.input"
id          = "abi.inputs"
spec        = ["ref/08 §2.5.3", "ref/08 §2.5.4", "ref/08 §2.6.g", "02 §4"]
hosts       = ["mcu", "linux"]
description = "jk_set_input_*: the conversions accepted by each setter, values outside the domain, NaN as Bad(nan), the allowed code and reason combinations, and the direction check"

[[signals]]
path = "io.b"
type = "bool"

[[signals]]
path = "io.i"
type = "i64"

[[signals]]
path = "io.u"
type = "u64"

[[signals]]
path = "io.f"
type = "f64"
unit = "1"

[[signals]]
path = "io.g"
type = "f32"
unit = "1"

[[signals]]
path = "io.s"
type = "string"

[[signals]]
path = "io.y"
type = "bytes"

[[outputs]]
path = "io.o"
type = "f64"
unit = "1"
safe = 0.0

