schema = 1

[board]
name    = "revpi-connect-5"
version = "1.0.0"
description = "Revolution Pi Connect 5. The fixed IO (board.led_a1, board.relay) is not declared yet: its GPIO lines need the board pinout."
arch    = "aarch64"
cpus    = 4
memory  = "4 GiB"
recommended = { rt = [3], io = [2], ml = [1, 2], bg = [0] }

[watchdog]
device  = "/dev/watchdog0"
timeout = "60s"

[serial]
"rs485-0" = "/dev/ttyRS485-0"
