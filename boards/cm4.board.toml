schema = 1

[board]
name         = "cm4"
version      = "1.0.0"
arch         = "aarch64"
tier         = "2"
vendor       = "Raspberry Pi"
model        = "Raspberry Pi Compute Module 4"
description  = "Compute Module 4 with eMMC and 4 GiB of RAM, on a carrier that brings out Ethernet. Lite (SD) units, other RAM sizes and the wireless option are variants: jk board new <name> --from cm4."
docs         = "https://www.raspberrypi.com/documentation/computers/compute-module.html"
cpus         = 4
memory       = "4 GiB"
clock        = "1.5 GHz"
storage      = "emmc"
kernel       = "preempt_rt"
recommended  = { rt = [3], io = [2], bg = [0, 1] }
boot_cmdline = ["isolcpus=3", "nohz_full=3", "rcu_nocbs=3"]

[watchdog]
device  = "/dev/watchdog0"
timeout = "15s"

[gpio]
chip = "pinctrl-bcm2711"

[io.act_led]
driver    = "sysfs"
led       = "ACT"
direction = "output"

[io.cpu_temp]
driver  = "sysfs"
thermal = "thermal_zone0"

[i2c]
"i2c1" = "/dev/i2c-1"

[serial]
"uart0" = "/dev/serial0"

[net]
"eth" = "eth0"
