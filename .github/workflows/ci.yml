name: ci
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  no-std:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv8m.main-none-eabihf, riscv32imac-unknown-none-elf]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --target ${{ matrix.target }} -p joker-units -p joker-expr -p joker-core -p joker-hal
      - run: cargo build --target ${{ matrix.target }} -p joker-hal --features alloc,plan

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo install --locked cargo-vet --version 0.10.2
      - run: cargo vet --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --locked -p joker-supply-chain

  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/spec-lint/spec_lint.py --max-score 0.5
      - run: python3 -c "import tomllib; tomllib.load(open('spec/codes.toml', 'rb'))"
