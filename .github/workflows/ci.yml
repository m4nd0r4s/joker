name: ci
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  no-std:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv8m.main-none-eabihf, riscv32imac-unknown-none-elf]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --target ${{ matrix.target }} -p joker-units -p joker-expr -p joker-core

  bench-firmware-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check --manifest-path tools/bench/esp32-modbus/Cargo.toml
      - run: cargo clippy --manifest-path tools/bench/esp32-modbus/logic/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/bench/esp32-modbus/logic/Cargo.toml

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
