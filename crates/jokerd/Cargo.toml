[package]
name = "jokerd"
description = "The Joker daemon: cycle domain, drivers, generations, decision log and local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
joker-core = { workspace = true, features = ["alloc", "zstd"] }
joker-units = { workspace = true, features = ["alloc"] }
joker-manifest = { path = "../joker-manifest" }
crossbeam-queue = "0.3.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = { version = "1.1.8", default-features = false, features = ["parse", "std"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["mman"] }

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
