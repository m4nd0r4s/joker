[package]
name = "jokerd"
description = "The Joker daemon: cycle domain, drivers, generations, decision log and local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
joker-core = { workspace = true, features = ["alloc"] }
joker-expr = { workspace = true, features = ["alloc"] }
joker-units = { workspace = true, features = ["alloc"] }
joker-manifest = { path = "../joker-manifest" }
joker-jkc = { path = "../joker-jkc" }
joker-hal = { path = "../joker-hal", features = ["std", "plan"] }
joker-driver-sysfs = { path = "../joker-drivers/sysfs" }
joker-driver-modbus = { path = "../joker-drivers/modbus" }
joker-driver-gpio = { path = "../joker-drivers/gpio" }
joker-driver-i2c = { path = "../joker-drivers/i2c" }
joker-driver-revpi = { path = "../joker-drivers/revpi" }
joker-api = { path = "../joker-api" }
joker-store = { path = "../joker-store" }
joker-host.workspace = true
humantime = "2.3"
crossbeam-queue = "0.3.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = { version = "1.1.8", default-features = false, features = ["parse", "std"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
zstd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "mman", "sched"] }
thread-priority = "3.1.1"

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }
jsonschema = { version = "0.33", default-features = false }
yaml-rust2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
joker-hal = { path = "../joker-hal", features = ["testing"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["async-await", "sink", "std"] }

[lints]
workspace = true
