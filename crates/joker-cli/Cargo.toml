[package]
name = "joker-cli"
description = "jk, the Joker command line (docs/07)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "jk"
path = "src/main.rs"

[dependencies]
joker-client = { path = "../joker-client" }
joker-jkc = { path = "../joker-jkc" }
joker-manifest = { path = "../joker-manifest" }
joker-api = { path = "../joker-api" }
jokerd = { path = "../jokerd" }
joker-host.workspace = true
joker-core = { workspace = true, features = ["alloc"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1.0.145"
toml = { version = "1.1.8", default-features = false, features = ["parse", "display", "serde", "std"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "signal", "time", "macros", "net"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["async-await", "sink", "std"] }

[dev-dependencies]
tempfile = "3.23"
joker-driver-modbus = { path = "../joker-drivers/modbus" }
jokerd = { path = "../jokerd" }

[lints]
workspace = true
