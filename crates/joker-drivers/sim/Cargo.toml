[package]
name = "joker-driver-sim"
description = "Joker sim driver: a simulated plant from a *.sim.toml model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
joker-hal = { workspace = true, features = ["std", "plan"] }
joker-core.workspace = true
joker-units.workspace = true
libm = "0.2.16"
toml = { version = "1.1.8", default-features = false, features = ["parse", "preserve_order", "serde", "std"] }

[dev-dependencies]
joker-hal = { workspace = true, features = ["testing"] }

[lints]
workspace = true
