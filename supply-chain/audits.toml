
# cargo-vet audits file

[[audits.rand]]
who = "Diogo Leite <diogo.r.leite27@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.9.4 -> 0.9.5"
notes = "The only code change rejects a deserialized UniformChar sampler whose range exceeds the char space, closing a memory-safety hole; no new unsafe, no new dependencies, no I/O."

[[audits.sha1]]
who = "Diogo Leite <diogo.r.leite27@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.10.6 -> 0.10.7"
notes = "Drops the optional sha1-asm backend and makes the asm feature a no-op; the remaining code paths are the already audited portable and intrinsics backends. No new unsafe, no new dependencies."

