[package]
name = "xtask"
description = "Repository tasks: the core conformance runner and the tick benchmark (docs/13 §1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
joker-core = { workspace = true, features = ["alloc"] }
joker-case-runner.workspace = true
joker-units.workspace = true
joker-expr.workspace = true
toml = "1.1"
serde_json = "1.0"
critical-section = { workspace = true, features = ["std"] }
jokerd = { path = "../crates/jokerd" }
joker-driver-modbus = { path = "../crates/joker-drivers/modbus" }
joker-hal = { path = "../crates/joker-hal", features = ["std", "plan"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }

[lints]
workspace = true
